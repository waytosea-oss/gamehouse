<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一字守城 · 游戏大厅</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#101c16,#080f0b);color:#e6f2e4;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:10px 12px 26px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.topbar a{color:#9fe8a8;text-decoration:none;font-size:15px}
.tname{font-size:18px;font-weight:700;letter-spacing:2px}
#muteBtn{background:#22392a;border:1px solid #37634a;color:#fff;border-radius:10px;padding:5px 10px;font-size:15px;cursor:pointer}
.hud{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:#1a2e21;border:1px solid #2f5240;border-radius:10px;padding:5px 10px;font-size:13px}
canvas{display:block;width:100%;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.5);touch-action:none}
#info{min-height:22px;text-align:center;color:#ffd97a;font-size:13.5px;margin:8px 0 6px}
.shop{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.rad{background:#1d3325;border:1px solid #356148;border-radius:11px;padding:6px 0 5px;text-align:center;cursor:pointer;color:#e6f2e4}
.rad.ch{font-size:21px;font-weight:800;line-height:1.15}
.rad.pr{font-size:11px;color:#ffd97a}
.rad.sel{background:#7a5a17;border-color:#ffd97a;box-shadow:0 0 0 2px rgba(255,217,122,.35)}
.rad.poor{opacity:.42}
.ctl{display:flex;gap:8px}
.cbtn{flex:1;border-radius:11px;padding:10px 0;font-size:15px;font-weight:700;border:1px solid #356148;background:#22392a;color:#cfe8d2;cursor:pointer}
.cbtn.main{background:linear-gradient(180deg,#ffb340,#f08c1a);color:#3a2200;border:none}
.ov{position:fixed;inset:0;background:rgba(4,10,6,.86);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.ov.card{width:min(88vw,380px);background:linear-gradient(180deg,#1e3a28,#12241a);border:1px solid #3c6b4d;border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.ov h1{margin:0 0 8px;font-size:27px;letter-spacing:2px}
.ov p{color:#c4dec8;font-size:14px;line-height:1.8;margin:6px 0}
.bigbtn{background:linear-gradient(180deg,#ffb340,#f08c1a);border:none;color:#3a2200;font-size:18px;font-weight:800;border-radius:12px;padding:12px 34px;margin-top:12px;cursor:pointer}
.hidden{display:none!important}
.best{color:#ffd97a;font-size:14px;margin-top:10px}
</style></head>
<body>
<div class="wrap">
<div class="topbar"><a href="../index.html">← 大厅</a><span class="tname">🏯 一字守城</span><button id="muteBtn">🔊</button></div>
<div class="hud"><span class="chip" id="goldChip">💰 130</span><span class="chip" id="hpChip">🏯 城门 20</span><span class="chip" id="waveChip">🌊 第 0/10 波</span><span class="chip" id="scoreChip">得分 0</span></div>
<canvas id="cv" width="480" height="480"></canvas>
<div id="info">点下方部首卡选字，再点空地落塔；同格放两个部首可拼字成塔。</div>
<div class="shop" id="shop"></div>
<div class="ctl"><button class="cbtn main" id="waveBtn">🌊 开始第一波</button><button class="cbtn" id="speedBtn">⏩ 速度 ×1</button></div>
</div>

<div class="ov" id="startOv"><div class="card">
<h1>🏯 一字守城</h1>
<p>妖怪沿小路攻向城门，你用金币买部首落塔防守。<br>同一格放两个部首能拼成字塔：<br>木+木＝林（减速）· 火+火＝炎（灼烧）· 日+月＝明（高伤）<br>人+人＝从（双发）· 人+木＝休（眩晕）· 水+木＝沐（溅射）· 山+石＝岩（重击）</p>
<p>守住 10 波获胜，城门血量归零则败。</p>
<button class="bigbtn" id="startBtn">开始守城</button>
<div class="best" id="bestStart">最高分：0</div>
</div></div>

<div class="ov hidden" id="endOv"><div class="card">
<h1 id="endTitle">🎉 守城成功</h1>
<p id="endText"></p>
<button class="bigbtn" id="againBtn">再来一局</button>
<div class="best" id="bestEnd">最高分：0</div>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
let AC=null,muted=false,lastShotSnd=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.1));o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(d||0.1)+0.03);}
function sfx(n){
if(n==='shoot'){const now=performance.now();if(now-lastShotSnd<70)return;lastShotSnd=now;tone(720,0.045,'square',0.045);}
else if(n==='coin'){tone(1318,0.07,'sine',0.1);tone(1568,0.09,'sine',0.08,0.05);}
else if(n==='place'){tone(392,0.08,'triangle',0.14);tone(523,0.1,'triangle',0.12,0.05);}
else if(n==='combo'){[523,659,784].forEach((f,i)=>tone(f,0.1,'triangle',0.13,i*0.06));}
else if(n==='leak'){tone(196,0.25,'sawtooth',0.14);tone(147,0.3,'sawtooth',0.12,0.08);}
else if(n==='horn'){tone(262,0.14,'square',0.09);tone(392,0.18,'square',0.09,0.12);}
else if(n==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.14,i*0.09));}
else if(n==='lose'){[330,262,196,147].forEach((f,i)=>tone(f,0.2,'sawtooth',0.1,i*0.11));}
else if(n==='err')tone(160,0.12,'square',0.08);
}
$('muteBtn').onclick=e=>{e.stopPropagation();muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';};

const COLS=10,ROWS=10,CELL=48,W=480,H=480;
const WAY=[[-1,2],[7,2],[7,5],[2,5],[2,8],[10,8]];
const PTS=WAY.map(p=>({x:p[0]*CELL+24,y:p[1]*CELL+24}));
const SEGS=[];let TOTAL=0;
for(let i=0;i<PTS.length-1;i++){const a=PTS[i],b=PTS[i+1];const len=Math.hypot(b.x-a.x,b.y-a.y);SEGS.push({a:a,b:b,len:len,start:TOTAL});TOTAL+=len;}
const LEAK_D=TOTAL-46;
const pathCells=new Set();
for(let i=0;i<WAY.length-1;i++){
let c=WAY[i][0],r=WAY[i][1];const tc=WAY[i+1][0],tr=WAY[i+1][1];
const dc=Math.sign(tc-c),dr=Math.sign(tr-r);
while(c!==tc||r!==tr){if(c>=0&&c<COLS&&r>=0&&r<ROWS)pathCells.add(c+','+r);c+=dc;r+=dr;}
if(tc>=0&&tc<COLS&&tr>=0&&tr<ROWS)pathCells.add(tc+','+tr);
}
function posAt(d){
for(const s of SEGS){if(d<=s.start+s.len){const k=s.len?(d-s.start)/s.len:0;return{x:s.a.x+(s.b.x-s.a.x)*k,y:s.a.y+(s.b.y-s.a.y)*k};}}
const last=PTS[PTS.length-1];return{x:last.x,y:last.y};
}
const RADS={
'木':{price:30,dmg:7,range:102,rate:0.9,color:'#7ac74f'},
'火':{price:30,dmg:8,range:100,rate:0.9,color:'#ff7a4d'},
'水':{price:35,dmg:7,range:104,rate:1.0,color:'#4db8ff'},
'日':{price:40,dmg:11,range:118,rate:0.75,color:'#ffd94d'},
'月':{price:40,dmg:11,range:118,rate:0.75,color:'#b0c4ff'},
'人':{price:25,dmg:6,range:100,rate:1.25,color:'#ffb27a'},
'土':{price:20,dmg:6,range:86,rate:0.9,color:'#c9962e'},
'山':{price:30,dmg:12,range:94,rate:0.7,color:'#9a8cff'},
'石':{price:35,dmg:12,range:94,rate:0.7,color:'#a8b8c8'}
};
const COMBOS={
'木|木':{char:'林',desc:'范围减速',dmg:5,range:112,rate:1.2,slow:0.45,color:'#5da83e'},
'火|火':{char:'炎',desc:'灼烧',dmg:6,range:102,rate:1.0,burn:16,color:'#ff5a2a'},
'日|月':{char:'明',desc:'高伤远程',dmg:27,range:152,rate:0.55,color:'#ffe97a'},
'人|人':{char:'从',desc:'双发连射',dmg:7,range:104,rate:1.0,targets:2,color:'#ff9a5c'},
'人|木':{char:'休',desc:'概率眩晕',dmg:7,range:104,rate:1.1,stun:0.22,color:'#8fd0a0'},
'水|木':{char:'沐',desc:'溅射',dmg:9,range:106,rate:0.8,splash:48,color:'#4dc3c7'},
'山|石':{char:'岩',desc:'重击',dmg:31,range:100,rate:0.45,color:'#8d9bb5'}
};
function comboOf(a,b){return COMBOS[a+'|'+b]||COMBOS[b+'|'+a]||null;}
const ETYPES={
norm:{emoji:'👺',hpM:1,spd:52,reward:11,leak:1,size:15},
tank:{emoji:'👹',hpM:3.1,spd:31,reward:20,leak:3,size:19},
fast:{emoji:'💨',hpM:0.55,spd:96,reward:13,leak:1,size:13}
};
const BESTK='gh_yizi_best';
let best=+(localStorage.getItem(BESTK)||0);
const cv=$('cv'),ctx=cv.getContext('2d');
let playing=false,phase='idle',gold=130,hp=20,wave=0,kills=0,score=0,cleared=0;
let towers={},enemies=[],projs=[],parts=[],spawnQ=[],spawnT=0,spawnInt=1,buildT=0,speedMul=1,selCard=null,selTower=null,lastTs=0,banner='',bannerT=0;

function buildShop(){
const sh=$('shop');sh.innerHTML='';
for(const k of Object.keys(RADS)){
const b=document.createElement('button');b.className='rad';b.dataset.k=k;
b.innerHTML='<div class="ch">'+k+'</div><div class="pr">💰'+RADS[k].price+'</div>';
b.onclick=()=>{
if(selCard===k){selCard=null;}
else{selCard=k;selTower=null;sfx('place');}
refreshShop();updInfo();
};
sh.appendChild(b);
}
}
function refreshShop(){
document.querySelectorAll('.rad').forEach(b=>{
const k=b.dataset.k;
b.classList.toggle('sel',selCard===k);
b.classList.toggle('poor',gold<RADS[k].price);
});
}
function updHud(){
$('goldChip').textContent='💰 '+gold;
$('hpChip').textContent='🏯 城门 '+hp;
$('waveChip').textContent='🌊 第 '+wave+'/10 波';
$('scoreChip').textContent='得分 '+score;
}
function updInfo(){
if(selTower&&towers[selTower]){
const t=towers[selTower];
$('info').textContent=''+t.desc+' · 伤害 '+t.dmg+' · 射程 '+Math.round(t.range);
return;
}
if(selCard){
const c=comboHint(selCard);
$('info').textContent='已选「'+selCard+'」，点空地落塔。'+(c?'放第二个部首试试拼字：'+c:'');
return;
}
$('info').textContent='点下方部首卡选字，再点空地落塔；同格放两个部首可拼字成塔。';
}
function comboHint(card){
const out=[];
for(const key of Object.keys(COMBOS)){
const ps=key.split('|');
if(ps[0]===card)out.push(card+'+'+ps[1]+'＝'+COMBOS[key].char);
else if(ps[1]===card&&ps[0]!==card)out.push(card+'+'+ps[0]+'＝'+COMBOS[key].char);
}
return out.join('、');
}
function makeTower(c,r,rad){
return {c:c,r:r,x:c*CELL+24,y:r*CELL+24,rads:[rad],label:rad,desc:'单字塔',dmg:RADS[rad].dmg,range:RADS[rad].range,rate:RADS[rad].rate,color:RADS[rad].color,eff:{},cd:0};
}
function applySecond(t,rad){
t.rads.push(rad);
const cb=comboOf(t.rads[0],rad);
if(cb){
t.label=cb.char;t.desc=cb.desc;t.dmg=cb.dmg;t.range=cb.range;t.rate=cb.rate;t.color=cb.color;
t.eff={slow:cb.slow||0,burn:cb.burn||0,targets:cb.targets||1,stun:cb.stun||0,splash:cb.splash||0};
return true;
}
const a=RADS[t.rads[0]],b=RADS[rad];
t.label=t.rads[0]+rad;t.desc='合字塔';
t.dmg=Math.round((a.dmg+b.dmg)*0.95);t.range=(a.range+b.range)/2;t.rate=(a.rate+b.rate)/2;t.color=b.color;t.eff={};
return false;
}
function tryPlace(c,r){
if(c<0||c>=COLS||r<0||r>=ROWS)return;
const key=c+','+r;
if(pathCells.has(key)){$('info').textContent='小路和城门不能落塔。';sfx('err');return;}
const t=towers[key];
if(t&&t.rads.length>=2){selTower=key;selCard=null;refreshShop();updInfo();return;}
if(!selCard){selTower=t?key:null;updInfo();return;}
const price=RADS[selCard].price;
if(gold<price){$('info').textContent='金币不够啦，击杀妖怪赚钱。';sfx('err');return;}
gold-=price;
if(t){const wasCombo=applySecond(t,selCard);sfx(wasCombo?'combo':'place');$('info').textContent=wasCombo?'拼字成功：「'+t.label+'」'+t.desc+'！':'合成合字塔「'+t.label+'」。';}
else{towers[key]=makeTower(c,r,selCard);sfx('place');}
selTower=key;
if(gold<price)selCard=null;
refreshShop();updHud();updInfo();
}
function startWave(){
if(phase==='fight')return;
wave++;phase='fight';
const n=wave;
const count=5+n*3,baseHp=20*Math.pow(1.21,n-1)+n*6;
spawnInt=Math.max(0.42,0.95-n*0.05);
spawnQ=[];
for(let i=0;i<count;i++){
let type='norm';
if(n>=3&&i%6===5)type='tank';else if(n>=4&&i%4===3)type='fast';
const et=ETYPES[type];
spawnQ.push({type:type,hp:baseHp*et.hpM,spd:et.spd,reward:et.reward,leak:et.leak});
}
spawnT=0.2;banner='第 '+n+' 波';bannerT=1.6;
sfx('horn');updHud();
$('waveBtn').textContent='⚔️ 战斗中…';
}
function waveCleared(){
cleared=wave;
const bonus=30+wave*4;gold+=bonus;score+=150;
if(wave>=10){endGame(true);return;}
phase='build';buildT=6;
$('info').textContent='第 '+wave+' 波守住了！奖励 💰'+bonus+'，抓紧布防。';
sfx('coin');updHud();
$('waveBtn').textContent='🌊 下一波（6s）';
}
function endGame(win){
phase='end';playing=false;
if(win)score+=hp*25;
if(score>best){best=score;localStorage.setItem(BESTK,best);}
sfx(win?'win':'lose');
$('endTitle').textContent=win?'🎉 守城成功':'🏚️ 城门被破';
$('endText').innerHTML=(win?'十波妖潮全部退散！':'你守到了第 '+wave+' 波。')+'<br>击杀 '+kills+' · 得分 <b style="color:#ffd97a">'+score+'</b>';
$('bestEnd').textContent='最高分：'+best;
$('endOv').classList.remove('hidden');
}
function reset(){
gold=130;hp=20;wave=0;kills=0;score=0;cleared=0;
towers={};enemies=[];projs=[];parts=[];spawnQ=[];
phase='build';buildT=3;selCard=null;selTower=null;
$('waveBtn').textContent='🌊 开始第一波';
refreshShop();updHud();updInfo();
}
function burst(x,y,color,n){
for(let i=0;i<(n||8);i++){
const a=Math.random()*6.28,s=40+Math.random()*90;
parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,color:color,r:2+Math.random()*2.5});
}
}
function hurt(e,dmg){
e.hp-=dmg;
if(e.hp<=0&&!e.dead){
e.dead=true;gold+=e.reward;kills++;score+=10;
burst(e.x,e.y,'#ffd97a',9);sfx('coin');updHud();
}
}
function update(dt){
if(bannerT>0)bannerT-=dt;
if(phase==='build'){
buildT-=dt;
$('waveBtn').textContent=wave===0?'🌊 开始第一波':'🌊 下一波（'+Math.ceil(buildT)+'s）';
if(buildT<=0)startWave();
}
if(phase==='fight'&&spawnQ.length){
spawnT-=dt;
if(spawnT<=0){
spawnT=spawnInt;
const s=spawnQ.shift(),p=posAt(0);
enemies.push({x:p.x,y:p.y,d:0,hp:s.hp,maxHp:s.hp,spd:s.spd,reward:s.reward,leak:s.leak,type:s.type,slowT:0,slowF:0,burnT:0,burnDps:0,stunT:0,dead:false});
}
}
// 敌人
for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];
if(e.dead){enemies.splice(i,1);continue;}
if(e.burnT>0){e.burnT-=dt;e.hp-=e.burnDps*dt;if(e.hp<=0){hurt(e,0);enemies.splice(i,1);continue;}}
let mul=1;
if(e.slowT>0){e.slowT-=dt;mul*=1-e.slowF;}
if(e.stunT>0){e.stunT-=dt;mul=0;}
e.d+=e.spd*mul*dt;
const p=posAt(e.d);e.x=p.x;e.y=p.y;
if(e.d>=LEAK_D){
enemies.splice(i,1);hp-=e.leak;burst(W-14,e.y,'#ff6a4d',12);sfx('leak');updHud();
$('info').textContent='妖怪冲进城门！城门 -'+e.leak;
if(hp<=0){hp=0;updHud();endGame(false);return;}
}
}
// 塔
for(const key of Object.keys(towers)){
const t=towers[key];t.cd-=dt;
if(t.cd>0)continue;
const inRange=enemies.filter(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<=t.range).sort((a,b)=>b.d-a.d);
if(!inRange.length)continue;
const targetsN=t.eff.targets||1;
for(let j=0;j<Math.min(targetsN,inRange.length);j++){
projs.push({x:t.x,y:t.y-8,tgt:inRange[j],dmg:t.dmg,eff:t.eff,color:t.color});
}
t.cd=1/t.rate;sfx('shoot');
}
// 子弹
for(let i=projs.length-1;i>=0;i--){
const p=projs[i];
if(p.tgt.dead){projs.splice(i,1);continue;}
const dx=p.tgt.x-p.x,dy=p.tgt.y-p.y,dist=Math.hypot(dx,dy),step=430*dt;
if(dist<=step+4){
const eff=p.eff;
hurt(p.tgt,p.dmg);
if(eff.slow){p.tgt.slowT=1.1;p.tgt.slowF=Math.max(p.tgt.slowF,eff.slow);}
if(eff.burn){p.tgt.burnT=2.5;p.tgt.burnDps=Math.max(p.tgt.burnDps,eff.burn);}
if(eff.stun&&Math.random()<eff.stun)p.tgt.stunT=0.7;
if(eff.splash){
for(const e2 of enemies){if(e2!==p.tgt&&!e2.dead&&Math.hypot(e2.x-p.tgt.x,e2.y-p.tgt.y)<=eff.splash)hurt(e2,p.dmg*0.5);}
burst(p.tgt.x,p.tgt.y,'#4dc3c7',6);
}
projs.splice(i,1);continue;
}
p.x+=dx/dist*step;p.y+=dy/dist*step;
}
for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.t>0.45)parts.splice(i,1);}
if(phase==='fight'&&!spawnQ.length&&!enemies.length&&playing)waveCleared();
}
function draw(){
ctx.clearRect(0,0,W,H);
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
ctx.fillStyle=(c+r)%2?'#1d3323':'#213a27';
ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
}
// 小路
ctx.lineCap='round';ctx.lineJoin='round';
ctx.strokeStyle='#8a6a38';ctx.lineWidth=42;ctx.beginPath();
PTS.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});ctx.stroke();
ctx.strokeStyle='#c2a15e';ctx.lineWidth=34;ctx.beginPath();
PTS.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});ctx.stroke();
ctx.fillStyle='rgba(70,48,16,.85)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
ctx.fillText('妖 山',52,116);
// 选卡时提示可落点
if(selCard){
ctx.fillStyle='rgba(255,233,150,.30)';
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
const key=c+','+r;
if(pathCells.has(key))continue;
const t=towers[key];
if(t&&t.rads.length>=2)continue;
ctx.beginPath();ctx.arc(c*CELL+24,r*CELL+24,4,0,7);ctx.fill();
}
}
// 城门
ctx.font='36px sans-serif';ctx.textAlign='center';
ctx.fillText('🏯',456,422);
// 塔
for(const key of Object.keys(towers)){
const t=towers[key],x=t.c*CELL,y=t.r*CELL;
if(selTower===key){
ctx.strokeStyle='rgba(255,217,122,.55)';ctx.lineWidth=1.5;
ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,7);ctx.stroke();
ctx.strokeStyle='#ffd97a';ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
}
ctx.fillStyle='#2c4258';
ctx.beginPath();ctx.roundRect(x+5,y+7,CELL-10,CELL-9,7);ctx.fill();
ctx.strokeStyle=t.color;ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle=t.color;ctx.fillRect(x+5,y+7,CELL-10,4);
ctx.fillStyle='#fff';ctx.textAlign='center';
if(t.rads.length===2&&t.label.length===2&&!COMBOS[t.rads[0]+'|'+t.rads[1]]&&!COMBOS[t.rads[1]+'|'+t.rads[0]]){
ctx.font='bold 15px sans-serif';
ctx.fillText(t.rads[0],x+15,y+33);ctx.fillText(t.rads[1],x+33,y+33);
}else{
ctx.font='bold 24px sans-serif';
ctx.fillText(t.label,x+24,y+36);
}
}
// 敌人
for(const e of enemies){
ctx.font=(ETYPES[e.type].size*2)+'px sans-serif';ctx.textAlign='center';
if(e.stunT>0){ctx.fillText('💫',e.x,e.y-16);}
ctx.fillText(ETYPES[e.type].emoji,e.x,e.y+ETYPES[e.type].size*0.7);
const w=34,k=Math.max(0,e.hp/e.maxHp);
ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(e.x-w/2,e.y-ETYPES[e.type].size-9,w,5);
ctx.fillStyle=e.burnT>0?'#ff8a3c':e.slowT>0?'#6ec6ff':'#7ae67a';
ctx.fillRect(e.x-w/2,e.y-ETYPES[e.type].size-9,w*k,5);
}
// 子弹
for(const p of projs){
ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
ctx.beginPath();ctx.arc(p.x,p.y,3.6,0,7);ctx.fill();ctx.shadowBlur=0;
}
// 粒子
for(const q of parts){
ctx.globalAlpha=Math.max(0,1-q.t/0.45);
ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();
}
ctx.globalAlpha=1;
if(bannerT>0){
ctx.globalAlpha=Math.min(1,bannerT);
ctx.fillStyle='#ffd97a';ctx.font='bold 34px sans-serif';ctx.textAlign='center';
ctx.fillText('🌊 '+banner,W/2,86);
ctx.globalAlpha=1;
}
if(phase==='idle'){
ctx.fillStyle='rgba(230,242,228,.65)';ctx.font='16px sans-serif';ctx.textAlign='center';
ctx.fillText('点「开始守城」，布塔迎敌',W/2,240);
}
}
function loop(ts){
requestAnimationFrame(loop);
const dt0=Math.min(0.05,(ts-lastTs)/1000||0.016);lastTs=ts;
if(playing&&phase!=='end')update(dt0*speedMul);
draw();
}
requestAnimationFrame(loop);
cv.addEventListener('pointerdown',e=>{
if(!playing)return;
const rect=cv.getBoundingClientRect();
const x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;
tryPlace((x/CELL)|0,(y/CELL)|0);
});
$('waveBtn').onclick=()=>{if(playing&&phase==='build')startWave();};
$('speedBtn').onclick=()=>{
speedMul=speedMul===1?2:1;
$('speedBtn').textContent='⏩ 速度 ×'+speedMul;
};
$('startBtn').onclick=()=>{$('startOv').classList.add('hidden');ac();reset();playing=true;};
$('againBtn').onclick=()=>{$('endOv').classList.add('hidden');reset();playing=true;};
$('bestStart').textContent='最高分：'+best;
buildShop();refreshShop();updHud();
</script>
</body></html>
