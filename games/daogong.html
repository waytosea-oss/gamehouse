<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>刀工大师 · 游戏大厅</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(160deg,#221206 0%,#3a1e08 55%,#4a2708 100%); min-height:100vh; color:#fdf3e3; }
  #app { max-width:480px; margin:0 auto; padding:10px 14px 28px; position:relative; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:8px 2px 12px; }
  .topbar a { color:#ffe9c9; text-decoration:none; font-size:15px; background:rgba(255,255,255,.12); padding:6px 12px; border-radius:999px; }
  .topbar .tname { font-size:17px; font-weight:700; letter-spacing:2px; }
  #muteBtn { font-size:18px; background:rgba(255,255,255,.12); border:none; color:#fff; width:38px; height:38px; border-radius:50%; cursor:pointer; }
  .hud { display:flex; gap:8px; margin-bottom:10px; }
  .hud .cell { flex:1; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:7px 0; text-align:center; font-size:13px; color:#f0d3a8; }
  .hud .cell b { display:block; font-size:17px; color:#fff; margin-top:1px; }
  .panel { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:16px 14px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .order { text-align:center; }
  .order .ono { font-size:12px; color:#f0d3a8; letter-spacing:3px; }
  .order .otxt { font-size:21px; font-weight:800; margin-top:5px; }
  .order .otxt em { font-style:normal; color:#ffb340; }
  .order .osub { font-size:12.5px; color:#d9bd93; margin-top:4px; }
  /* 案板与食材 */
  #board { margin-top:16px; background:linear-gradient(180deg,#8a5a2b,#71471f); border-radius:14px; padding:26px 12px 30px; box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 -8px 18px rgba(0,0,0,.35); position:relative; overflow:hidden; }
  #food { position:relative; height:86px; border-radius:44px; cursor:crosshair; box-shadow:0 8px 18px rgba(0,0,0,.45), inset 0 -10px 18px rgba(0,0,0,.22), inset 0 8px 12px rgba(255,255,255,.35); }
  #food .emojis { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-around; font-size:30px; opacity:.38; pointer-events:none; }
  #food.done { cursor:default; }
  .cut { position:absolute; top:-6px; bottom:-6px; width:0; border-left:3px dashed rgba(255,255,255,.92); filter:drop-shadow(0 0 3px rgba(0,0,0,.6)); pointer-events:none; }
  .cut::before { content:"🔪"; position:absolute; top:-24px; left:-11px; font-size:15px; }
  #pieces { position:relative; height:86px; display:none; }
  .piece { position:absolute; top:0; height:86px; border-radius:20px; box-shadow:0 8px 16px rgba(0,0,0,.4), inset 0 -10px 16px rgba(0,0,0,.2), inset 0 8px 12px rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:rgba(60,30,0,.75); text-shadow:0 1px 0 rgba(255,255,255,.5); animation:split .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes split { from { transform:translateY(-8px) scale(.96); opacity:.4; } to { transform:translateY(0) scale(1); opacity:1; } }
  .crumb { position:absolute; width:7px; height:7px; border-radius:2px; pointer-events:none; animation:fall .8s ease-in forwards; z-index:5; }
  @keyframes fall { to { transform:translateY(74px) rotate(160deg); opacity:0; } }
  .progress { text-align:center; font-size:13px; color:#f0d3a8; margin-top:12px; min-height:18px; }
  .stars { text-align:center; font-size:32px; letter-spacing:6px; min-height:40px; margin-top:4px; }
  .stars .on { color:#ffcf3f; text-shadow:0 2px 10px rgba(255,190,40,.65); }
  .stars .off { color:rgba(255,255,255,.22); }
  .verdict { text-align:center; font-size:15px; font-weight:700; color:#ffd9a0; min-height:22px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
  .chip { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:3px 10px; font-size:12px; color:#ffe9c9; }
  .chip.bad { border-color:#ff7a7a; color:#ffb3b3; }
  .btnrow { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; border:none; border-radius:14px; padding:13px 0; font-size:15px; font-weight:700; cursor:pointer; letter-spacing:1px; }
  .btn.gold { background:linear-gradient(180deg,#ffc95e,#f08c0a); color:#572e00; box-shadow:0 6px 16px rgba(240,140,10,.35); }
  .btn.ghostb { background:rgba(255,255,255,.12); color:#ffe9c9; }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.38; }
  .overlay { position:fixed; inset:0; background:rgba(24,10,0,.85); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.hidden { display:none; }
  .card { width:100%; max-width:400px; background:linear-gradient(165deg,#54300f,#331c06); border:1px solid rgba(255,255,255,.18); border-radius:22px; padding:28px 24px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.55); }
  .card .big { font-size:52px; }
  .card h1 { font-size:26px; letter-spacing:4px; margin:8px 0 10px; }
  .card p { font-size:14px; line-height:1.75; color:#f5dcb8; }
  .card .best { margin-top:12px; font-size:13px; color:#ffc95e; }
  .card .bigbtn { margin-top:18px; width:100%; border:none; border-radius:16px; padding:15px 0; font-size:18px; font-weight:800; letter-spacing:3px; background:linear-gradient(180deg,#ffc95e,#f08c0a); color:#572e00; cursor:pointer; box-shadow:0 8px 22px rgba(240,140,10,.4); }
  .card .bigbtn:active { transform:scale(.97); }
  .card .score { font-size:38px; font-weight:800; color:#ffc95e; margin:6px 0; }
</style>

<body>
<div id="app">
  <div class="topbar">
    <a href="../index.html">← 大厅</a>
    <div class="tname">🔪 刀工大师</div>
    <button id="muteBtn" title="静音">🔊</button>
  </div>

  <div class="hud">
    <div class="cell">订单<b id="hudOrder">1 / 8</b></div>
    <div class="cell">总分<b id="hudScore">0</b></div>
    <div class="cell">星星<b id="hudStars">0 ★</b></div>
  </div>

  <div class="panel">
    <div class="order">
      <div class="ono" id="orderNo">— 第 1 单 —</div>
      <div class="otxt" id="orderTxt">豆腐切 3 等份</div>
      <div class="osub">在食材上点按落刀，每份大小越接近，分越高</div>
    </div>
    <div id="board">
      <div id="food"><div class="emojis" id="foodEmojis"></div></div>
      <div id="pieces"></div>
    </div>
    <div class="progress" id="progress">已落刀 0 / 2</div>
    <div class="stars" id="stars"></div>
    <div class="verdict" id="verdict"></div>
    <div class="chips" id="chips"></div>
    <div class="btnrow">
      <button class="btn ghostb" id="undoBtn">↩ 撤一刀</button>
      <button class="btn gold" id="cutBtn" disabled>🔪 切好了</button>
      <button class="btn gold" id="nextBtn" style="display:none;">下一单 →</button>
    </div>
  </div>
</div>

<div class="overlay" id="startScr">
  <div class="card">
    <div class="big">🔪</div>
    <h1>刀工大师</h1>
    <p>后厨来订单啦：把食材切成指定的等份。<br>在食材上点按落刀，刀数够了点「切好了」上菜，<br>每份体积误差越小，星星越多。一共 8 单，单单见真章。</p>
    <div class="best" id="startBest">最高分：0</div>
    <button class="bigbtn" id="startBtn">开 始 接 单</button>
  </div>
</div>

<div class="overlay hidden" id="endScr">
  <div class="card">
    <div class="big" id="endEmoji">👨‍🍳</div>
    <h1 id="endTitle">收工！</h1>
    <p id="endDesc">八单全部上菜完毕。</p>
    <div class="score" id="endScore">0</div>
    <div class="best" id="endBest">最高分：0</div>
    <button class="bigbtn" id="againBtn">再 来 一 轮</button>
  </div>
</div>

<script>
"use strict";
/* ---------- 极简合成音效 ---------- */
let AC = null, muted = false;
function beep(f, d, type, v, delay) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (d || 0.09));
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + (d || 0.09) + 0.03);
  } catch (e) {}
}
const sfx = {
  click: () => beep(600, 0.06, "sine", 0.10),
  chop:  () => { beep(190, 0.07, "square", 0.16); beep(90, 0.1, "sine", 0.18, 0.02); },
  undo:  () => beep(380, 0.07, "sine", 0.10),
  good:  () => { [660, 880, 1100].forEach((f, i) => beep(f, 0.13, "triangle", 0.12, i * 0.07)); },
  mid:   () => { beep(520, 0.12, "triangle", 0.12); beep(660, 0.12, "triangle", 0.10, 0.09); },
  bad:   () => beep(150, 0.2, "sawtooth", 0.10)
};
document.getElementById("muteBtn").addEventListener("click", function () {
  muted = !muted;
  this.textContent = muted ? "🔇" : "🔊";
  if (!muted) sfx.click();
});

/* ---------- 订单数据 ---------- */
const ORDERS = [
  { name: "嫩豆腐", emoji: "⬜", n: 3, bg: "linear-gradient(180deg,#fbf7e8,#e9dfc2)", txt: "豆腐切 3 等份" },
  { name: "黄瓜",   emoji: "🥒", n: 4, bg: "linear-gradient(180deg,#7ed37e,#2e8b3a)", txt: "黄瓜切 4 段" },
  { name: "胡萝卜", emoji: "🥕", n: 5, bg: "linear-gradient(180deg,#ffb066,#f06a1d)", txt: "胡萝卜切 5 段" },
  { name: "西瓜",   emoji: "🍉", n: 2, bg: "linear-gradient(90deg,#2e9e4f 0%,#2e9e4f 6%,#f2506e 12%,#e63950 88%,#2e9e4f 94%,#2e9e4f 100%)", txt: "西瓜切两半" },
  { name: "法棍面包", emoji: "🍞", n: 4, bg: "linear-gradient(180deg,#f3cd8d,#cf8f3e)", txt: "面包切 4 片" },
  { name: "腊肠",   emoji: "🌭", n: 6, bg: "linear-gradient(180deg,#e08a6d,#a03d21)", txt: "腊肠切 6 段" },
  { name: "草莓蛋糕", emoji: "🍰", n: 3, bg: "linear-gradient(180deg,#ffe9f2,#f5a8c0)", txt: "蛋糕切 3 等份" },
  { name: "白萝卜", emoji: "🥬", n: 5, bg: "linear-gradient(180deg,#f4faf0,#cfe3c2)", txt: "白萝卜切 5 段" }
];
const BEST_KEY = "gh_daogong_best";
const $ = id => document.getElementById(id);

let orderIdx = 0, totalScore = 0, totalStars = 0, cuts = [], submitted = false, playing = false;

function cur() { return ORDERS[orderIdx]; }

function render() {
  const o = cur();
  $("hudOrder").textContent = (orderIdx + 1) + " / " + ORDERS.length;
  $("hudScore").textContent = totalScore;
  $("hudStars").textContent = totalStars + " ★";
  $("orderNo").textContent = "— 第 " + (orderIdx + 1) + " 单 · " + o.name + " —";
  $("orderTxt").innerHTML = o.txt.replace(/(\d+|两)/, "<em>$1</em>");
  const food = $("food");
  food.style.display = submitted ? "none" : "block";
  food.style.background = o.bg;
  food.classList.toggle("done", submitted);
  $("foodEmojis").textContent = (o.emoji + " ").repeat(5);
  // 切口
  food.querySelectorAll(".cut").forEach(e => e.remove());
  cuts.slice().sort((a, b) => a - b).forEach(p => {
    const c = document.createElement("div");
    c.className = "cut"; c.style.left = p + "%";
    food.appendChild(c);
  });
  $("progress").textContent = submitted ? "" : ("已落刀 " + cuts.length + " / " + (o.n - 1) + "（点食材落刀）");
  $("cutBtn").disabled = submitted || cuts.length !== o.n - 1;
  $("undoBtn").disabled = submitted || !cuts.length;
  $("cutBtn").style.display = submitted ? "none" : "block";
  $("nextBtn").style.display = submitted ? "block" : "none";
  $("nextBtn").textContent = orderIdx >= ORDERS.length - 1 ? "结算收工 →" : "下一单 →";
  if (!submitted) { $("stars").innerHTML = ""; $("verdict").textContent = ""; $("chips").innerHTML = ""; $("pieces").style.display = "none"; }
}

$("food").addEventListener("pointerdown", function (e) {
  if (!playing || submitted) return;
  const o = cur();
  if (cuts.length >= o.n - 1) return;
  const r = this.getBoundingClientRect();
  const p = (e.clientX - r.left) / r.width * 100;
  if (p < 5 || p > 95) return;
  if (cuts.some(c => Math.abs(c - p) < 4)) { $("verdict").textContent = "离上一刀太近，换个地方下刀"; return; }
  cuts.push(p);
  sfx.chop();
  spawnCrumbs(p);
  render();
});

function spawnCrumbs(pct) {
  const board = $("board");
  const fr = $("food").getBoundingClientRect(), br = board.getBoundingClientRect();
  const x = fr.left - br.left + fr.width * pct / 100;
  for (let i = 0; i < 6; i++) {
    const c = document.createElement("div");
    c.className = "crumb";
    c.style.background = ["#fff6da", "#e8d9ae", "#ffffff"][i % 3];
    c.style.left = (x + (Math.random() * 26 - 13)) + "px";
    c.style.top = (fr.top - br.top + 66 + Math.random() * 10) + "px";
    c.style.animationDelay = (Math.random() * 0.15) + "s";
    board.appendChild(c);
    setTimeout(() => c.remove(), 1100);
  }
}

$("undoBtn").addEventListener("click", () => { if (cuts.length && !submitted) { cuts.pop(); sfx.undo(); render(); } });

$("cutBtn").addEventListener("click", () => {
  if (submitted) return;
  const o = cur();
  submitted = true;
  const sorted = cuts.slice().sort((a, b) => a - b);
  const bounds = [0].concat(sorted, [100]);
  const sizes = [];
  for (let i = 0; i < bounds.length - 1; i++) sizes.push(bounds[i + 1] - bounds[i]);
  const ideal = 100 / o.n;
  const avgErr = sizes.reduce((s, v) => s + Math.abs(v - ideal), 0) / sizes.length;
  let stars = 0;
  if (avgErr <= 1.8) stars = 3; else if (avgErr <= 4) stars = 2; else if (avgErr <= 7.5) stars = 1;
  const gain = Math.max(60, Math.round(1000 - avgErr * 105));
  totalScore += gain; totalStars += stars;
  // 星星与评语
  $("stars").innerHTML = [1, 2, 3].map(i => '<span class="' + (i <= stars ? "on" : "off") + '">★</span>').join("");
  $("verdict").textContent = stars === 3 ? "稳如老厨！+" + gain + " 分" : stars === 2 ? "刀工不错！+" + gain + " 分" : stars === 1 ? "勉强上菜，+" + gain + " 分" : "大小不一啦，+" + gain + " 分";
  if (stars >= 2) sfx.good(); else if (stars === 1) sfx.mid(); else sfx.bad();
  // 碎块分开动画
  const pz = $("pieces");
  pz.innerHTML = ""; pz.style.display = "block";
  let left = 0;
  sizes.forEach((sz, i) => {
    const d = document.createElement("div");
    d.className = "piece";
    d.style.left = "calc(" + left + "% + " + (i * 3) + "px)";
    d.style.width = "calc(" + sz + "% - " + ((sizes.length - 1) * 3 / sizes.length) + "px)";
    d.style.background = o.bg;
    d.style.animationDelay = (i * 0.05) + "s";
    d.textContent = sz.toFixed(0) + "%";
    pz.appendChild(d);
    left += sz;
  });
  $("chips").innerHTML = sizes.map((sz, i) =>
    '<span class="chip' + (Math.abs(sz - ideal) > ideal * 0.35 ? " bad" : "") + '">第' + (i + 1) + '份 ' + sz.toFixed(1) + '%（目标 ' + ideal.toFixed(1) + '%）</span>').join("");
  render();
});

$("nextBtn").addEventListener("click", () => {
  sfx.click();
  if (orderIdx >= ORDERS.length - 1) { endGame(); return; }
  orderIdx++; cuts = []; submitted = false;
  render();
});

function startGame() {
  orderIdx = 0; totalScore = 0; totalStars = 0; cuts = []; submitted = false; playing = true;
  $("startScr").classList.add("hidden");
  $("endScr").classList.add("hidden");
  render();
  sfx.click();
}

function endGame() {
  playing = false;
  const best = Math.max(totalScore, +(localStorage.getItem(BEST_KEY) || 0));
  localStorage.setItem(BEST_KEY, best);
  $("endEmoji").textContent = totalStars >= 20 ? "🏆" : totalStars >= 14 ? "👨‍🍳" : "🔪";
  $("endTitle").textContent = totalStars >= 20 ? "刀神收工！" : "收工！";
  $("endDesc").textContent = "8 单全部上菜，共摘 " + totalStars + " 颗星。";
  $("endScore").textContent = totalScore;
  $("endBest").textContent = "最高分：" + best;
  $("endScr").classList.remove("hidden");
}

$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);
$("startBest").textContent = "最高分：" + (localStorage.getItem(BEST_KEY) || 0);
render();
</script>
</body>
</html>
