let AC = null, masterGain = null, sfxGain = null, musicGain = null, noiseBuf = null, muted = false;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 6;
      comp.connect(AC.destination);
      masterGain = AC.createGain(); masterGain.gain.value = muted ? 0 : 0.85; masterGain.connect(comp);
      sfxGain = AC.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(masterGain);
      musicGain = AC.createGain(); musicGain.gain.value = 0.46; musicGain.connect(masterGain);
      const delay = AC.createDelay(1); delay.delayTime.value = 0.27;
      const fb = AC.createGain(); fb.gain.value = 0.26;
      const dwet = AC.createGain(); dwet.gain.value = 0.35;
      musicGain.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(dwet); dwet.connect(masterGain);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, dest, delaySec) {
  if (!AC) return;
  const t0 = AC.currentTime + (delaySec || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.05, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t0); o.stop(t0 + dur + 0.02);
}

  if (!AC) return;
  const t0 = AC.currentTime + (delaySec || 0);
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  src.playbackRate.value = 0.7 + Math.random() * 0.6;
  const flt = AC.createBiquadFilter(); flt.type = filterType || 'lowpass';
  flt.frequency.setValueAtTime(f0 || 1200, t0);
  if (f1) flt.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(flt); flt.connect(g); g.connect(dest || sfxGain); src.start(t0); src.stop(t0 + dur + 0.02);
}

/* 爆炸：五层叠加——炸裂瞬间＋冲击咔哒＋主体轰响＋低频下潜＋余烬/碎片 */
function boom(size) {
  const P = [
    { crack: 0.32, body: 0.16, bodyV: 0.30, sub: 0.22, subF: 96 },
    { crack: 0.40, body: 0.26, bodyV: 0.40, sub: 0.34, subF: 86 },
    { crack: 0.50, body: 0.45, bodyV: 0.52, sub: 0.50, subF: 76 },
    { crack: 0.56, body: 0.70, bodyV: 0.60, sub: 0.62, subF: 68 }
  ][size];
  noiseHit(0.05, P.crack, 'highpass', 1400, 0);
  tone(340, 0.07, 'square', 0.15, 55);
  noiseHit(P.body, P.bodyV, 'lowpass', 2500, 110);
  tone(P.subF, P.body * 0.95, 'sine', P.sub, 27);
  if (size >= 1) noiseHit(P.body * 1.5, P.bodyV * 0.45, 'lowpass', 480, 70, 0.07);
  if (size >= 2) { for (let i = 0; i < 3; i++) noiseHit(0.05, 0.10, 'highpass', 2400, 0, 0.10 + i * 0.07 + Math.random() * 0.03); }
}

/* 程序化 BGM：132 BPM 电子循环——四踩底鼓＋驱动贝斯＋和弦刀＋主旋律 */
const BPM = 132, STEPDUR = 60 / BPM / 4;
const CHORDS = [
  { root: 55.00, tones: [220.00, 261.63, 329.63] },
  { root: 43.65, tones: [174.61, 220.00, 261.63] },
  { root: 65.41, tones: [261.63, 329.63, 392.00] },
  { root: 49.00, tones: [196.00, 246.94, 293.66] }
];
/* 主旋律（A 小调，4 小节 × 16 步，0 为休止） */
const MELODY = [
  440, 0, 523.25, 0, 659.25, 0, 523.25, 0, 880, 0, 659.25, 0, 587.33, 0, 523.25, 0,
  523.25, 0, 698.46, 0, 880, 0, 698.46, 0, 783.99, 0, 698.46, 0, 659.25, 0, 523.25, 0,
  659.25, 0, 659.25, 0, 783.99, 0, 659.25, 0, 523.25, 0, 587.33, 0, 659.25, 0, 783.99, 0,
  493.88, 0, 587.33, 0, 783.99, 0, 587.33, 0, 493.88, 0, 587.33, 0, 392.00, 0, 493.88, 0
];
let musicTimer = null, nextStepTime = 0, stepIdx = 0;
function scheduleStep(s, t) {

  if (st % 4 === 0) { tone(122, 0.13, 'sine', 0.55, 40, musicGain, dl); tone(950, 0.015, 'square', 0.07, 300, musicGain, dl); }
  /* 军鼓 */
  if (st === 4 || st === 12) { noiseHit(0.09, 0.13, 'bandpass', 1800, 900, dl, musicGain); tone(185, 0.06, 'triangle', 0.08, 120, musicGain, dl); }
  /* 踩镲：反拍闭镲＋小节末开镲 */
  if (st % 2 === 1) noiseHit(0.03, 0.05, 'highpass', 6800, 0, dl, musicGain);
  if (st === 14) noiseHit(0.13, 0.055, 'highpass', 6800, 0, dl, musicGain);
  /* 驱动贝斯：八分音符，中频可闻 */
  if (st % 2 === 0) tone(ch.root * 2, STEPDUR * 1.7, 'sawtooth', 0.16, 0, musicGain, dl);
  if (st === 0 || st === 8) tone(ch.root, STEPDUR * 3, 'square', 0.09, 0, musicGain, dl);
  /* 和弦刀：反拍短促和弦 */
  if (st === 7 || st === 15) {
    for (const f of ch.tones) {
      tone(f * 0.997, 0.16, 'sawtooth', 0.042, 0, musicGain, dl);
      tone(f * 1.003, 0.16, 'sawtooth', 0.042, 0, musicGain, dl);
    }
  }

  const m = MELODY[s % 64];
  if (m) {

    tone(m * 1.004, STEPDUR * 1.7, 'square', 0.035, 0, musicGain, dl);
  } else if (st % 2 === 0) {
    /* 休止处的高音琶音火花 */
    tone(ch.tones[(s >> 1) % 3] * 4, STEPDUR * 0.9, 'triangle', 0.02, 0, musicGain, dl);

let lastT = 0;

function ambient(dt) {
  for (const s of stars) { s.y += (s.v + 60) * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  scrollWorld(dt);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const s of smokes) { s.y += s.vy * dt; s.r += 9 * dt; s.life -= dt; }
  smokes = smokes.filter(s => s.life > 0);
  for (const r of rings) { r.r += r.vr * dt; r.life -= dt; }

}
function scrollWorld(dt) {
  bgScroll += 13 * dt;
  planetT -= dt;
  if (planetT <= 0) {
    planetT = 26 + Math.random() * 16;
    planets.push({ x: 70 + Math.random() * (W - 140), y: -240, w: 200 + Math.random() * 120, vy: 14 + Math.random() * 7 });
  }
  for (const p of planets) p.y += p.vy * dt;
  planets = planets.filter(p => p.y - 200 < H);
  for (const wsp of wisps) { wsp.y += wsp.vy * dt; wsp.x += 4 * dt; }
  wisps = wisps.filter(wsp => wsp.y - wsp.w < H);
  while (wisps.length < 4) wisps.push(newWisp(-320 - Math.random() * 160));
}

function update(dt) {
  elapsed += dt;
  for (const s of stars) { s.y += (s.v + 60) * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  scrollWorld(dt);

  if (player.alive) {
    player.px = player.x;
    if (ptr.active) {
      player.x += (ptr.x - player.x) * Math.min(1, dt * 18);
      player.y += (ptr.y - 20 - player.y) * Math.min(1, dt * 18);
    } else {
      const sp = 330;
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= sp * dt;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += sp * dt;
      if (keys['ArrowUp'] || keys['KeyW']) player.y -= sp * dt;
      if (keys['ArrowDown'] || keys['KeyS']) player.y += sp * dt;
    }
    player.x = Math.max(26, Math.min(W - 26, player.x));
    player.y = Math.max(64, Math.min(H - 34, player.y));
    const vx = dt > 0 ? (player.x - player.px) / dt : 0;
    const targetBank = Math.max(-0.22, Math.min(0.22, vx * 0.00045));
    player.bank += (targetBank - player.bank) * Math.min(1, dt * 10);
    if (player.inv > 0) player.inv -= dt;
    if (player.muzzleT > 0) player.muzzleT -= dt;

    if (parts.length < 850) {
      for (const nx of [-10.5, 0, 10.5]) {
        parts.push({ x: player.x + nx + (Math.random() - 0.5) * 2, y: player.y + 60,
          vx: (Math.random() - 0.5) * 12, vy: 120 + Math.random() * 40,
          life: 0.26, max: 0.26, r: 2.4, c: 'rgba(120,200,255,0.8)', trail: true });
      }
    }

    player.fireT -= dt;
    if (player.fireT <= 0) { fireWeapons(); player.fireT = 0.115; }
  } else {
    player.respawnT -= dt;
    if (player.respawnT <= 0 && lives >= 0 && state === 'playing') {
      player.alive = true; player.x = W / 2; player.y = H - 110; player.inv = 2.4; ebullets = [];
    }
  }

  if (!boss) {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = 0.85 + Math.random() * 0.5;
      const pat = Math.random();
      if (pat < 0.42) { const x = 40 + Math.random() * (W - 80); for (let i = 0; i < 3; i++) spawnFighter(x, i * 46); }
      else if (pat < 0.68) { spawnWeaver(50 + Math.random() * (W - 100)); spawnWeaver(50 + Math.random() * (W - 100)); }
      else { spawnFighter(30 + Math.random() * 90); spawnFighter(W - 120 + Math.random() * 90); }
    }
    gunshipT -= dt; if (gunshipT <= 0) { gunshipT = 11 + Math.random() * 5; spawnGunship(70 + Math.random() * (W - 140)); }
    turretT -= dt; if (turretT <= 0) { turretT = 7 + Math.random() * 6; spawnTurret(36 + Math.random() * (W - 72)); }
    rockT -= dt; if (rockT <= 0) { rockT = 3.4 + Math.random() * 2.6; spawnRock(); }

  }

    alarmT -= dt; if (alarmT <= 0) { alarmT = 0.62; sndAlarm(); }
    if (warnT <= 0) spawnBoss();
  }

  for (const e of enemies) {
    e.t += dt;
    if (e.flashT > 0) e.flashT -= dt;
    if (e.hp > 0 && e.hp < e.maxhp * 0.5 && Math.random() < dt * 14) {
      smokes.push({ x: e.x + (Math.random() - 0.5) * 10, y: e.y, vx: (Math.random() - 0.5) * 14,
        vy: 46, r: 4 + Math.random() * 5, life: 0.8 + Math.random() * 0.5, max: 1.3 });
    }
    if (e.kind === 'fighter') {
      e.y += e.vy * dt; e.x += Math.sin(e.t * 2.1) * 26 * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 10 && e.y < H * 0.55 && player.alive) { e.fireT = 2.4 + Math.random() * 2; if (Math.random() < 0.55) eShoot(e, aimAng(e), 185 + loopCount * 14, 16); }
    } else if (e.kind === 'weaver') {
      e.y += e.vy * dt; e.x = e.baseX + Math.sin(e.t * 3.1) * 62;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 10 && player.alive) { e.fireT = 3 + Math.random() * 2; eShoot(e, aimAng(e), 175, 16); }
    } else if (e.kind === 'gunship') {
      e.y += e.vy * dt; if (e.y > 120) e.y = 120 + Math.sin(e.t * 0.8) * 16;
      e.x += Math.sin(e.t * 0.6) * 22 * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && player.alive) { e.burst = 3; e.fireT = 2.1; }
      if (e.burst > 0) {
        e.burstT = (e.burstT || 0) - dt;
        if (e.burstT <= 0) { eShoot(e, aimAng(e), 215, 30); e.burst--; e.burstT = 0.16; }
      }
    } else if (e.kind === 'turret') {
      e.y += e.vy * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 0 && e.y < H * 0.6 && player.alive) { e.fireT = 2.6 + Math.random(); eShoot(e, aimAng(e), 168); }
    } else if (e.kind === 'rock') {
      e.y += e.vy * dt; e.x += e.vx * dt; e.rot += e.vr * dt;
      if (e.x < e.r + 4 || e.x > W - e.r - 4) e.vx = -e.vx;
      e.x = Math.max(e.r, Math.min(W - e.r, e.x));

      else {
        e.x = W / 2 + Math.sin(e.t * 0.45) * 95;
        e.atkT -= dt;
        if (e.atkT <= 0) {
          e.atkMode = (e.atkMode + 1) % 3; e.atkT = 2.4;
          if (e.atkMode === 0 && player.alive) { for (let i = -1; i <= 1; i++) eShoot(e, aimAng(e) + i * 0.16, 235, 46); }
          else if (e.atkMode === 1) { for (let i = 0; i < 14; i++) eShoot(e, (i / 14) * 6.283 + e.t, 138, 20); }
          else { spawnFighter(e.x - 60, 0); spawnFighter(e.x + 60, 0); if (player.alive) eShoot(e, aimAng(e), 250, 46); }
        }
        e.fireT -= dt;
        if (e.fireT <= 0 && player.alive) { e.fireT = 0.9; eShoot(e, aimAng(e), 205, 46); }
      }
    }
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 120 && e.y > -220);

  for (const b of pbullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  pbullets = pbullets.filter(b => b.y > -24 && b.x > -16 && b.x < W + 16);
  ebullets = ebullets.filter(b => b.y > -16 && b.y < H + 16 && b.x > -16 && b.x < W + 16);

  for (const b of pbullets) {
    if (b.dead) continue;
    for (const e of enemies) {
      const dx = b.x - e.x, dy = b.y - e.y, rr = e.r + 3;
      if (dx * dx + dy * dy < rr * rr) {
        b.dead = true; damageEnemy(e, b.dmg); sndHit();
        parts.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 60, vy: -40, life: 0.16, max: 0.16, r: 2, c: '#ffe9a8' });
        break;
      }
    }
  }
  pbullets = pbullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  if (player.alive) {
    for (const b of ebullets) {
      const dx = b.x - player.x, dy = b.y - player.y;

      }

    }
    for (const p of pows) {
      const dx = player.x - p.x, dy = player.y - p.y, d2 = dx * dx + dy * dy;
      if (d2 < 150 * 150) { p.x += dx * dt * 6; p.y += dy * dt * 6; }
      if (d2 < 30 * 30) {
        p.got = true;
        if (p.type === 'P') { sndUpgrade(); weapon = Math.min(5, weapon + 1); addFloat(player.x, player.y - 54, '火力升级!', '#7dd87d'); score += 250; }
        else { sndPow(); bombs = Math.min(6, bombs + 1); addFloat(player.x, player.y - 54, '轰炸 +1', '#ffb59d'); score += 250; }
      }
    }
  }
  for (const p of pows) { p.t += dt; p.y += p.vy * dt; p.x += Math.sin(p.t * 3) * 18 * dt; }
  pows = pows.filter(p => !p.got && p.y < H + 24);

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; if (!p.trail) { p.vx *= 0.98; p.vy *= 0.98; } p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const s of smokes) { s.x += s.vx * dt; s.y += s.vy * dt; s.r += 9 * dt; s.life -= dt; }
  smokes = smokes.filter(s => s.life > 0);
  for (const r of rings) { r.r += r.vr * dt; r.life -= dt; }
  rings = rings.filter(r => r.life > 0);
  for (const f of floats) { f.y -= 44 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 34);
  if (flash > 0) flash -= dt;
}

function fireWeapons() {
  const x = player.x, y = player.y - 40;
  const B = (bx, by, ang, dmg) => pbullets.push({ x: bx, y: by, vx: Math.sin(ang) * 640, vy: -Math.cos(ang) * 640, dmg: dmg || 1 });
  if (weapon === 1) { B(x, y, 0); }
  else if (weapon === 2) { B(x - 8, y + 4, 0); B(x + 8, y + 4, 0); }
  else if (weapon === 3) { B(x, y, 0); B(x - 12, y + 6, -0.10); B(x + 12, y + 6, 0.10); }
  else if (weapon === 4) { B(x - 7, y, 0); B(x + 7, y, 0); B(x - 16, y + 6, -0.17); B(x + 16, y + 6, 0.17); }
  else { B(x, y - 2, 0, 2); B(x - 8, y + 3, 0); B(x + 8, y + 3, 0); B(x - 18, y + 7, -0.20); B(x + 18, y + 7, 0.20); }
  player.muzzleT = 0.05;

/* ---------------- 绘制 ---------------- */
function sprH(img, w) { return img.naturalWidth ? w * img.naturalHeight / img.naturalWidth : w; }
function drawSprite(img, x, y, w, rot, flashA) {
  if (!img || !img.naturalWidth) return;
  const h = sprH(img, w);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  if (flashA > 0 && FILTER_OK) {
    ctx.globalAlpha = Math.min(1, flashA) * 0.75;
    ctx.filter = 'brightness(2.4) saturate(0.3)';
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.filter = 'none'; ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawShadow(img, x, y, w, rot) {
  if (!FILTER_OK || !img || !img.naturalWidth) return;
  const h = sprH(img, w);
  ctx.save(); ctx.translate(x + 12, y + 16); ctx.rotate(rot || 0);
  ctx.globalAlpha = 0.30; ctx.filter = 'brightness(0)';
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function drawPlayer(x, y, t, bank, scaleW) {
  const w = scaleW || 84;
  const h = sprH(SPR.j36, w);
  drawShadow(SPR.j36, x, y, w, bank);
  /* 三发尾焰 */
  ctx.save(); ctx.translate(x, y); ctx.rotate(bank || 0);
  const fl = (10 + Math.sin(t * 42) * 3 + Math.random() * 2) * (w / 84);
  for (const nx of [-10.5 * (w / 84), 0, 10.5 * (w / 84)]) {
    const base = h / 2 - 6 * (w / 84);
    const g = ctx.createLinearGradient(0, base, 0, base + fl + 10);
    g.addColorStop(0, 'rgba(190,230,255,0.95)'); g.addColorStop(0.35, 'rgba(90,160,255,0.6)'); g.addColorStop(1, 'rgba(60,90,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(nx - 3.2 * (w / 84), base); ctx.lineTo(nx + 3.2 * (w / 84), base); ctx.lineTo(nx, base + fl + 10); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  drawSprite(SPR.j36, x, y, w, bank, 0);
  if (player.muzzleT > 0 && state === 'playing') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(bank || 0);
    ctx.fillStyle = 'rgba(255,230,160,' + (player.muzzleT / 0.05) + ')';
    ctx.beginPath(); ctx.arc(-5, -h / 2 + 12, 3.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -h / 2 + 12, 3.4, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}
function hitFlashA(e) { return e.flashT > 0 ? e.flashT / 0.09 : 0; }
function drawFighter(e) {
  const rot = Math.PI + Math.sin(e.t * 2.2) * 0.07;
  drawShadow(SPR.fighter, e.x, e.y, 50, rot);
  drawSprite(SPR.fighter, e.x, e.y, 50, rot, hitFlashA(e));
}
function drawWeaver(e) {
  const rot = Math.PI + Math.sin(e.t * 3.4) * 0.13;
  drawShadow(SPR.weaver, e.x, e.y, 48, rot);
  drawSprite(SPR.weaver, e.x, e.y, 48, rot, hitFlashA(e));
}
function drawGunship(e) {
  drawShadow(SPR.gunship, e.x, e.y, 118, Math.PI);
  drawSprite(SPR.gunship, e.x, e.y, 118, Math.PI, hitFlashA(e));
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(e.x - 28, e.y - 108, 56, 5);
  ctx.fillStyle = '#e2543e'; ctx.fillRect(e.x - 28, e.y - 108, 56 * Math.max(0, e.hp / e.maxhp), 5);
}
function drawTurret(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = '#43464d';
  ctx.beginPath(); ctx.arc(0, 0, 16.5, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#33363d';
  ctx.fillRect(-14, -14, 28, 28);
  ctx.strokeStyle = 'rgba(190,200,220,0.4)'; ctx.strokeRect(-14, -14, 28, 28);
  ctx.strokeStyle = 'rgba(220,180,90,0.5)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(-6, -14); ctx.moveTo(14, 14); ctx.lineTo(6, 14); ctx.stroke();
  const a = aimAng(e);
  ctx.rotate(a + Math.PI / 2);
  ctx.fillStyle = '#1f2228'; ctx.fillRect(-3.2, -4, 6.4, -14);
  ctx.fillStyle = '#101216'; ctx.fillRect(-1.4, -19, 2.8, -3);
  ctx.fillStyle = '#747a86'; ctx.beginPath(); ctx.arc(0, 0, 8.8, 0, 6.283); ctx.fill();
  const bl = 0.5 + Math.sin(e.t * 6) * 0.5;
  ctx.fillStyle = 'rgba(255,84,62,' + (0.5 + bl * 0.5) + ')';
  ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, 6.283); ctx.fill();
  ctx.restore();
  if (e.flashT > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,255,255,' + (e.flashT / 0.09 * 0.28) + ')';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.8, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}
function drawRock(e) {
  drawSprite(SPR.rock, e.x, e.y, e.w, e.rot, hitFlashA(e));
}
function drawBoss(e) {
  drawSprite(SPR.boss, e.x, e.y, 216, 0, hitFlashA(e));
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(40, 46, W - 80, 10);
  const bg2 = ctx.createLinearGradient(40, 0, W - 40, 0);
  bg2.addColorStop(0, '#ff7a5c'); bg2.addColorStop(1, '#c22f1d');
  ctx.fillStyle = bg2; ctx.fillRect(40, 46, (W - 80) * Math.max(0, e.hp / e.maxhp), 10);
  ctx.fillStyle = '#ffd9d2'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('BOSS', W / 2, 41);
}

function render() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#04060e'; ctx.fillRect(0, 0, W, H);
  /* 星云底图：镜像平铺无缝滚动 */
  if (!bgTile && SPR.bg.naturalWidth) buildBgTile();
  if (bgTile) { const off = bgScroll % H; ctx.drawImage(bgTile, 0, off - H); }
  /* 远景行星 */
  for (const p of planets) drawSprite(SPR.planet, p.x, p.y, p.w, 0, 0);
  /* 星云团：加色混合，黑底自动透明 */
  if (SPR.wisp.naturalWidth) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const wsp of wisps) {
      const wh = sprH(SPR.wisp, wsp.w);
      ctx.globalAlpha = wsp.a;
      ctx.save(); ctx.translate(wsp.x, wsp.y); ctx.rotate(wsp.rot); ctx.scale(wsp.flip, 1);
      ctx.drawImage(SPR.wisp, -wsp.w / 2, -wh / 2, wsp.w, wh);
      ctx.restore();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  /* 近景星尘 */
  ctx.fillStyle = '#cfe0ff';
  for (const s of stars) { ctx.globalAlpha = 0.16 + s.s * 0.2; ctx.fillRect(s.x, s.y, s.s, s.s * 2.2); }
  ctx.globalAlpha = 1;

  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  for (const s of smokes) {
    ctx.fillStyle = 'rgba(120,124,132,' + (0.34 * (s.life / s.max)) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }

  for (const p of pows) {
    ctx.save(); ctx.translate(p.x, p.y);
    const pulse = 1 + Math.sin(p.t * 6) * 0.12;
    ctx.scale(pulse, pulse);
    ctx.fillStyle = p.type === 'P' ? 'rgba(24,70,30,0.92)' : 'rgba(80,30,16,0.92)';
    ctx.strokeStyle = p.type === 'P' ? '#7dd87d' : '#ffb59d'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = p.type === 'P' ? 'rgba(125,216,125,0.4)' : 'rgba(255,181,157,0.4)';
    ctx.beginPath(); ctx.arc(0, 0, 16.5, 0, 6.283); ctx.stroke();
    ctx.fillStyle = p.type === 'P' ? '#a9f2a9' : '#ffc9b5';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.type, 0, 1);
    ctx.restore();
  }

  for (const e of enemies) {
    if (e.kind === 'fighter') drawFighter(e);
    else if (e.kind === 'weaver') drawWeaver(e);
    else if (e.kind === 'gunship') drawGunship(e);
    else if (e.kind === 'turret') drawTurret(e);
    else if (e.kind === 'rock') drawRock(e);
    else if (e.kind === 'boss') drawBoss(e);
  }

  ctx.strokeStyle = 'rgba(255,190,90,0.4)'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (const b of pbullets) { ctx.moveTo(b.x - b.vx * 0.016, b.y - b.vy * 0.016); ctx.lineTo(b.x, b.y); }
  ctx.stroke();
  for (const b of pbullets) {
    ctx.fillStyle = 'rgba(255,180,80,0.30)';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 5, 10, Math.atan2(b.vy, b.vx) + Math.PI / 2, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffefa8';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 2.6, 7, Math.atan2(b.vy, b.vx) + Math.PI / 2, 0, 6.283); ctx.fill();
  }
  for (const b of ebullets) {
    ctx.fillStyle = 'rgba(255,90,60,0.28)';
    ctx.beginPath(); ctx.arc(b.x, b.y, 7.6, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ff8a66';
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffd9c9';
    ctx.beginPath(); ctx.arc(b.x - 1, b.y - 1, 1.5, 0, 6.283); ctx.fill();
  }

  if (state === 'title') {
    const tt = performance.now() / 1000;
    drawPlayer(W / 2, H * 0.40 + Math.sin(tt * 1.1) * 9, tt, Math.sin(tt * 0.7) * 0.06, 200);
  } else if (player.alive) {
    if (!(player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0)) drawPlayer(player.x, player.y, elapsed, player.bank, 84);
    ctx.fillStyle = 'rgba(140,220,255,0.9)';
    ctx.beginPath(); ctx.arc(player.x, player.y, 2.6, 0, 6.283); ctx.fill();
  }

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.life / r.max) * 0.8;
    ctx.strokeStyle = r.c; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.283); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  for (const f of floats) { ctx.globalAlpha = Math.max(0, f.life); ctx.fillStyle = f.c; ctx.fillText(f.txt, f.x, f.y); }
  ctx.globalAlpha = 1;

  if (state !== 'title') {
    ctx.fillStyle = 'rgba(6,12,24,0.55)';
    ctx.beginPath(); ctx.roundRect(8, 8, 168, 30, 6); ctx.fill();
    ctx.beginPath(); ctx.roundRect(W - 150, 8, 142, 30, 6); ctx.fill();
    ctx.beginPath(); ctx.roundRect(8, H - 76, 190, 68, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(110,160,255,0.25)';
    ctx.beginPath(); ctx.roundRect(8, 8, 168, 30, 6); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(W - 150, 8, 142, 30, 6); ctx.stroke();

    ctx.fillStyle = '#dfe7f5'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('分数 ' + score, 16, 28);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#9db8e8';
    ctx.fillText('最高 ' + Math.max(best, score), W - 16, 28);
    for (let i = 0; i < Math.max(0, lives); i++) {
      if (SPR.j36.naturalWidth) {
        const iw = 25, ih = sprH(SPR.j36, iw);
        ctx.drawImage(SPR.j36, 28 + i * 30 - iw / 2, H - 50 - ih / 2, iw, ih);
      }
    }
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#7dd87d';
    ctx.fillText('火力', 16, H - 16);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i < weapon ? '#7dd87d' : 'rgba(125,216,125,0.22)';
      ctx.fillRect(48 + i * 15, H - 24, 10, 9);
    }
    ctx.fillStyle = '#ffb59d'; ctx.textAlign = 'right';
    ctx.fillText('轰炸 × ' + bombs, 190, H - 16);
  }

  if (warnT > 0 && Math.floor(warnT * 4) % 2 === 0) {
    ctx.fillStyle = 'rgba(255,60,40,0.92)'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⚠ 警 告 ⚠', W / 2, H / 2 - 40);
    ctx.font = '15px sans-serif'; ctx.fillText('大型敌机接近中', W / 2, H / 2 - 12);
  }
  if (flash > 0) { ctx.fillStyle = 'rgba(255,240,210,' + (flash * 0.85) + ')'; ctx.fillRect(0, 0, W, H); }
  if (paused && state === 'playing') {
    ctx.fillStyle = 'rgba(4,7,14,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#dfe7f5'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('暂 停', W / 2, H / 2);
  }
  ctx.restore();

  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.36, W / 2, H / 2, H * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ---------------- 流程 ---------------- */
function reset() {
  score = 0; lives = 3; bombs = 2; weapon = 1;
  elapsed = 0; loopCount = 0; spawnT = 0.4; gunshipT = 8; turretT = 5; rockT = 3.5; bossT = 65;
  boss = null; shake = 0; flash = 0; warnT = 0;
  pbullets = []; ebullets = []; enemies = []; parts = []; smokes = []; rings = []; pows = []; floats = [];
  player.x = W / 2; player.y = H - 120; player.alive = true; player.inv = 1.6; player.fireT = 0; player.bank = 0;
  ptr.x = W / 2; ptr.y = H - 100;
}
function startGame() {
  audio(); sndClick(); reset(); state = 'playing'; paused = false; startMusic();
  document.getElementById('titleScr').classList.add('hidden');
  document.getElementById('overScr').classList.add('hidden');
  document.getElementById('bombBtn').style.display = 'flex';
}
function gameOver() {
  state = 'over'; stopMusic(); sndGameOver();
  best = Math.max(best, score);
  document.getElementById('finalScore').textContent = '本局分数 ' + score;
  document.getElementById('bestScore').textContent = '最高纪录 ' + best;
  document.getElementById('overScr').classList.remove('hidden');
  document.getElementById('bombBtn').style.display = 'none';
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
const bb = document.getElementById('bombBtn');
bb.addEventListener('touchstart', e => { e.preventDefault(); useBomb(); }, { passive: false });
bb.addEventListener('mousedown', e => { e.preventDefault(); useBomb(); });
document.getElementById('muteBtn').addEventListener('click', () => { audio(); toggleMute(); });
</script>
