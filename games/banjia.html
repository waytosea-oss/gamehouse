<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>搬家小熊 · 游戏大厅</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#12291f,#1d4030 60%,#265239); color:#ecf7ee; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:10px 12px 24px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:6px 2px 10px; }
  .topbar a { color:#ffd98a; text-decoration:none; font-size:15px; font-weight:600; padding:6px 8px; }
  .topbar h1 { font-size:19px; letter-spacing:2px; }
  #muteBtn { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:999px; width:38px; height:38px; font-size:17px; cursor:pointer; }
  .hud { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px 12px; font-size:14px; }
  .hud b { color:#ffd98a; }
  .lvrow { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:12px 0 4px; }
  .lvchip { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#d9ecd9; border-radius:999px; padding:6px 11px; font-size:13px; cursor:pointer; }
  .lvchip.cur { background:linear-gradient(180deg,#3f9e57,#256b38); border-color:#ffd98a; color:#fff; font-weight:700; }
  .hint { text-align:center; font-size:12.5px; color:#b9d9bd; min-height:18px; margin:4px 0 8px; }
  #board { display:grid; gap:2px; width:min(94vw,400px); margin:0 auto; background:#0d1f16; padding:6px; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.07); touch-action:none; }
  .cell { aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.055); position:relative; line-height:1; }
  .cell.wall { background:linear-gradient(145deg,#7a5230,#5d3d22); box-shadow:inset 0 0 0 1px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.15); }
  .cell.ice { background:linear-gradient(145deg,#cfeeff,#93d2f2); box-shadow:inset 0 0 0 1px rgba(255,255,255,.6); }
  .cell.tgt::after { content:''; position:absolute; width:52%; height:52%; border-radius:50%; border:3px solid rgba(255,92,72,.85); background:rgba(255,92,72,.12); }
  .cell .e { position:relative; z-index:2; }
  .cell.boxdone { background:rgba(120,255,150,.22); }
  .pad { display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,52px); gap:6px; justify-content:center; margin-top:14px; }
  .pad button { background:linear-gradient(180deg,#2e5d3f,#21452d); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:12px; font-size:20px; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,.3); }
  .pad button:active { transform:scale(.94); background:#3f9e57; }
  .pad .blank { visibility:hidden; }
  .btnrow { display:flex; gap:10px; justify-content:center; margin-top:12px; }
  .btn { background:linear-gradient(180deg,#2e5d3f,#21452d); color:#ecf7ee; border:1px solid rgba(255,255,255,.25); border-radius:12px; padding:10px 18px; font-size:15px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.3); }
  .btn:active { transform:scale(.96); }
  .btn.gold { background:linear-gradient(180deg,#e8a83e,#c47f1d); border-color:#ffd98a; color:#fff; font-weight:700; }
  .winbar { text-align:center; margin-top:12px; display:none; }
  .winbar.show { display:block; }
  .winbar .msg { font-size:16px; color:#ffd98a; margin-bottom:8px; }
  .ov { position:fixed; inset:0; background:rgba(6,16,10,.85); display:flex; align-items:center; justify-content:center; z-index:20; padding:20px; }
  .ov.hidden { display:none; }
  .card { background:linear-gradient(180deg,#1e4230,#173324); border:1px solid rgba(255,217,138,.35); border-radius:20px; padding:26px 24px; max-width:400px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .card h2 { font-size:26px; letter-spacing:3px; margin-bottom:10px; }
  .card p { font-size:14.5px; line-height:1.75; color:#cfe8d2; margin-bottom:8px; }
  .card .big { font-size:44px; margin-bottom:6px; }
  .card .score { font-size:20px; color:#ffd98a; margin:10px 0 4px; }
  .card .best { font-size:13.5px; color:#a9cbb0; margin-bottom:16px; }
  #startBtn, #againBtn { background:linear-gradient(180deg,#e8a83e,#c47f1d); color:#fff; border:none; border-radius:14px; padding:13px 42px; font-size:18px; font-weight:700; cursor:pointer; box-shadow:0 6px 16px rgba(196,127,29,.45); letter-spacing:2px; }
  #startBtn:active, #againBtn:active { transform:scale(.97); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="../index.html">← 大厅</a>
    <h1>搬家小熊</h1>
    <button id="muteBtn" aria-label="静音">🔊</button>
  </div>
  <div class="hud">
    <div>关卡 <b id="lvNow">1</b> / 8</div>
    <div>步数 <b id="stepNow">0</b></div>
    <div>得分 <b id="scoreNow">0</b></div>
  </div>
  <div class="lvrow" id="lvrow"></div>
  <div class="hint" id="hint"></div>
  <div id="board"></div>
  <div class="pad">
    <span class="blank"></span><button data-d="up">▲</button><span class="blank"></span>
    <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
  </div>
  <div class="btnrow">
    <button class="btn" id="undoBtn">↩ 撤销</button>
    <button class="btn" id="resetBtn">↻ 重开</button>
  </div>
  <div class="winbar" id="winbar">
    <div class="msg" id="winMsg"></div>
    <button class="btn gold" id="nextBtn">下一关 →</button>
  </div>
</div>

<div class="ov" id="startOv">
  <div class="card">
    <div class="big">🐻</div>
    <h2>搬家小熊</h2>
    <p>小熊搬家啦！用方向键、方向按钮或滑动，<br>把所有 📦 推到红圈目标上。</p>
    <p>箱子只能推不能拉，推到墙角可就出不来了。<br>后两关有 ❄ 冰面：箱子和小熊都会滑行！</p>
    <button id="startBtn">开始游戏</button>
    <div class="best" id="bestStart">最高分：0</div>
  </div>
</div>

<div class="ov hidden" id="endOv">
  <div class="card">
    <div class="big">🏠</div>
    <h2>全部搬完！</h2>
    <p>八关箱子全部归位，小熊的新家布置好了。</p>
    <div class="score">总得分：<span id="finalScore">0</span></div>
    <div class="best">最高分：<span id="finalBest">0</span></div>
    <button id="againBtn">再来一局</button>
  </div>
</div>

<script>
'use strict';
/* ---------- 极简 WebAudio 音效 ---------- */
let AC = null, muted = false;
function beep(f, d, type, v, delay) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f || 660;
    g.gain.setValueAtTime(v || 0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (d || 0.08));
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + (d || 0.08) + 0.03);
  } catch (e) {}
}
const sfx = {
  step: () => beep(300 + Math.random() * 60, 0.05, 'triangle', 0.1),
  push: () => beep(190, 0.08, 'triangle', 0.13),
  slide:() => beep(880, 0.12, 'sine', 0.07),
  bump: () => beep(140, 0.09, 'sawtooth', 0.08),
  undo: () => beep(340, 0.06, 'sine', 0.1),
  good: () => { beep(660, 0.09, 'sine', 0.13); beep(880, 0.12, 'sine', 0.13, 0.09); },
  win:  () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.14, 'triangle', 0.13, i * 0.1)); }
};
const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (!muted) sfx.step();
});

/* ---------- 关卡数据 ---------- */
/* # 墙 · 空格 地面 · ~ 冰面 · . 目标 · $ 箱子 · @ 小熊 —— 8 关均手工验证可解 */
const LEVELS = [
  { name: '热身一推', map: [
    '#####',
    '#@  #',
    '# $ #',
    '#  .#',
    '#####'] },
  { name: '拐个弯', map: [
    '#######',
    '#     #',
    '# @ $ #',
    '#  .  #',
    '#     #',
    '#######'] },
  { name: '双箱齐下', map: [
    '#######',
    '#     #',
    '# $ $ #',
    '# @   #',
    '# . . #',
    '#######'] },
  { name: '各就各位', map: [
    '########',
    '#      #',
    '# $$   #',
    '# @  . #',
    '#    . #',
    '########'] },
  { name: '三足鼎立', map: [
    '#########',
    '#   #   #',
    '# $ # $ #',
    '# @   . #',
    '#   # . #',
    '# $   . #',
    '#########'] },
  { name: '长蛇阵', map: [
    '##########',
    '#        #',
    '# $$  .  #',
    '# @   .  #',
    '# $   .  #',
    '#        #',
    '##########'] },
  { name: '冰面初试', ice: true, map: [
    '########',
    '#      #',
    '# @$~. #',
    '#      #',
    '########'] },
  { name: '冰上漫步', ice: true, map: [
    '########',
    '#@~~   #',
    '# ###  #',
    '# $ .  #',
    '#      #',
    '########'] }
];

/* ---------- 状态 ---------- */
const SLUG = 'banjia';
let level = 0, steps = 0, score = 0, best = +(localStorage.getItem('gh_' + SLUG + '_best') || 0);
let W = 0, H = 0, walls, iceCells, targets, boxes, bear, undoStack = [], won = false;
const cleared = new Set();
const board = document.getElementById('board');
const K = (x, y) => x + ',' + y;

function parseLevel(i) {
  const rows = LEVELS[i].map;
  H = rows.length; W = rows[0].length;
  walls = new Set(); iceCells = new Set(); targets = new Set(); boxes = new Set(); bear = { x: 1, y: 1 };
  rows.forEach((row, y) => {
    [...row].forEach((c, x) => {
      if (c === '#') walls.add(K(x, y));
      else if (c === '~') iceCells.add(K(x, y));
      else if (c === '.') targets.add(K(x, y));
      else if (c === '$') boxes.add(K(x, y));
      else if (c === '@') bear = { x, y };
    });
  });
  steps = 0; undoStack = []; won = false;
}
function render() {
  board.style.gridTemplateColumns = 'repeat(' + W + ', 1fr)';
  board.style.fontSize = Math.max(13, Math.floor(board.clientWidth / W * 0.58)) + 'px';
  let html = '';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = K(x, y);
    let cls = 'cell', inner = '';
    if (walls.has(k)) { cls += ' wall'; inner = ''; }
    else {
      if (iceCells.has(k)) cls += ' ice';
      if (targets.has(k)) cls += ' tgt';
      if (boxes.has(k)) { inner = '<span class="e">📦</span>'; if (targets.has(k)) cls += ' boxdone'; }
      else if (bear.x === x && bear.y === y) inner = '<span class="e">🐻</span>';
      else if (iceCells.has(k)) inner = '<span class="e" style="font-size:.5em;opacity:.65">❄</span>';
    }
    html += '<div class="' + cls + '">' + inner + '</div>';
  }
  board.innerHTML = html;
  document.getElementById('lvNow').textContent = level + 1;
  document.getElementById('stepNow').textContent = steps;
  document.getElementById('scoreNow').textContent = score;
  renderChips();
}
function renderChips() {
  const row = document.getElementById('lvrow');
  row.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const c = document.createElement('button');
    c.className = 'lvchip' + (i === level ? ' cur' : '');
    c.textContent = (i + 1) + ' ' + L.name + (cleared.has(i) ? ' ✓' : '');
    c.addEventListener('click', () => { sfx.step(); loadLevel(i); });
    row.appendChild(c);
  });
}
function loadLevel(i) {
  level = i; parseLevel(i);
  document.getElementById('winbar').className = 'winbar';
  document.getElementById('hint').textContent = LEVELS[i].ice
    ? '❄ 冰面关：小熊和箱子踏上冰面都会滑行，算好停点！'
    : '把所有 📦 推到红圈上 · 推错可用撤销';
  render();
}
function snapshot() {
  undoStack.push({ bear: { ...bear }, boxes: [...boxes] });
  if (undoStack.length > 300) undoStack.shift();
}
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function blocked(x, y) { return walls.has(K(x, y)); }
function move(dirName) {
  if (won) return;
  const d = DIRS[dirName]; if (!d) return;
  const nx = bear.x + d[0], ny = bear.y + d[1], nk = K(nx, ny);
  if (blocked(nx, ny)) { sfx.bump(); return; }
  snapshot();
  if (boxes.has(nk)) {
    /* 推箱子：箱子先走（含冰面滑行），小熊跟进一步 */
    let bx = nx, by = ny;
    const tx = bx + d[0], ty = by + d[1];
    if (blocked(tx, ty) || boxes.has(K(tx, ty))) { undoStack.pop(); sfx.bump(); return; }
    boxes.delete(nk);
    bx = tx; by = ty;
    let slid = false;
    while (iceCells.has(K(bx, by))) {
      const ax = bx + d[0], ay = by + d[1];
      if (blocked(ax, ay) || boxes.has(K(ax, ay))) break;
      bx = ax; by = ay; slid = true;
      if (!iceCells.has(K(bx, by))) break;
    }
    boxes.add(K(bx, by));
    bear.x = nx; bear.y = ny;
    steps++;
    if (slid) sfx.slide(); else sfx.push();
  } else {
    bear.x = nx; bear.y = ny;
    steps++;
    /* 小熊在冰面滑行 */
    let slid = false;
    while (iceCells.has(K(bear.x, bear.y))) {
      const ax = bear.x + d[0], ay = bear.y + d[1];
      if (blocked(ax, ay) || boxes.has(K(ax, ay))) break;
      bear.x = ax; bear.y = ay; slid = true;
      if (!iceCells.has(K(bear.x, bear.y))) break;
    }
    if (slid) sfx.slide(); else sfx.step();
  }
  render();
  if ([...targets].every(t => boxes.has(t))) winLevel();
}
function winLevel() {
  won = true; cleared.add(level);
  const gain = Math.max(150, 600 - steps * 3);
  score += gain;
  if (score > best) { best = score; localStorage.setItem('gh_' + SLUG + '_best', best); }
  sfx.win(); render();
  if (level === LEVELS.length - 1) {
    setTimeout(() => {
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalBest').textContent = best;
      document.getElementById('endOv').classList.remove('hidden');
    }, 600);
  } else {
    document.getElementById('winMsg').textContent = '🎉 第 ' + (level + 1) + ' 关搬完！用步 ' + steps + ' · +' + gain + ' 分';
    document.getElementById('winbar').className = 'winbar show';
  }
}

/* ---------- 操作 ---------- */
document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('click', () => move(b.dataset.d));
});
let swipeStart = null;
board.addEventListener('pointerdown', e => { swipeStart = { x: e.clientX, y: e.clientY }; });
board.addEventListener('pointerup', e => {
  if (!swipeStart) return;
  const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
  swipeStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
window.addEventListener('keydown', e => {
  if (!document.getElementById('startOv').classList.contains('hidden')) return;
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  const d = map[e.key];
  if (d) { e.preventDefault(); move(d); }
});
document.getElementById('undoBtn').addEventListener('click', () => {
  if (won || !undoStack.length) return;
  const s = undoStack.pop();
  bear = s.bear; boxes = new Set(s.boxes);
  steps = Math.max(0, steps - 1);
  sfx.undo(); render();
});
document.getElementById('resetBtn').addEventListener('click', () => { sfx.undo(); loadLevel(level); });
document.getElementById('nextBtn').addEventListener('click', () => { sfx.good(); loadLevel(level + 1); });
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startOv').classList.add('hidden');
  sfx.good(); loadLevel(0);
});
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('endOv').classList.add('hidden');
  score = 0; cleared.clear(); sfx.good(); loadLevel(0);
});
document.getElementById('bestStart').textContent = '最高分：' + best;
loadLevel(0);
</script>
</body>
</html>
