<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>琉璃珠串 · 游戏大厅</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(160deg,#1b1035 0%,#2a1650 55%,#3b1d5e 100%); min-height:100vh; color:#f3eaff; }
  #app { max-width:480px; margin:0 auto; padding:10px 14px 28px; position:relative; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:8px 2px 12px; }
  .topbar a { color:#e9dcff; text-decoration:none; font-size:15px; background:rgba(255,255,255,.12); padding:6px 12px; border-radius:999px; }
  .topbar .tname { font-size:17px; font-weight:700; letter-spacing:2px; }
  #muteBtn { font-size:18px; background:rgba(255,255,255,.12); border:none; color:#fff; width:38px; height:38px; border-radius:50%; cursor:pointer; }
  .hud { display:flex; gap:8px; margin-bottom:10px; }
  .hud .cell { flex:1; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:7px 0; text-align:center; font-size:13px; color:#cdbcf5; }
  .hud .cell b { display:block; font-size:17px; color:#fff; margin-top:1px; }
  .panel { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:14px 12px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .secttl { font-size:13px; color:#cdbcf5; letter-spacing:2px; margin:2px 0 10px; text-align:center; }
  /* 串绳区 */
  #stringZone { position:relative; padding:16px 4px 8px; }
  #rope { position:absolute; left:6px; right:6px; top:50%; height:4px; margin-top:-2px; background:linear-gradient(90deg,#d8b46a,#f5dd9a,#d8b46a); border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  #slots { position:relative; display:flex; flex-wrap:wrap; justify-content:center; gap:7px; z-index:1; }
  .slot { width:40px; height:40px; border-radius:50%; position:relative; flex:0 0 auto; }
  .slot .ghost { position:absolute; inset:0; border-radius:50%; border:2px dashed; opacity:.55; }
  .slot .bead { position:absolute; inset:1px; border-radius:50%; box-shadow:inset -5px -6px 9px rgba(0,0,0,.35), inset 4px 5px 7px rgba(255,255,255,.55), 0 3px 6px rgba(0,0,0,.4); animation:pop .35s cubic-bezier(.2,2.2,.4,1); }
  .slot .bead::after { content:""; position:absolute; left:22%; top:14%; width:34%; height:24%; border-radius:50%; background:rgba(255,255,255,.85); filter:blur(1px); }
  .slot.wrong .bead { outline:3px solid #ff5470; outline-offset:1px; }
  .slot.last .bead { cursor:pointer; }
  @keyframes pop { 0%{ transform:scale(.3) rotate(-40deg);} 100%{ transform:scale(1) rotate(0);} }
  .hintline { text-align:center; font-size:12.5px; color:#b7a6e8; margin-top:10px; min-height:18px; }
  /* 轨道区 */
  #rails { display:flex; justify-content:center; gap:16px; margin-top:6px; }
  .rail { width:64px; border-radius:16px; background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.13)); border:1px solid rgba(255,255,255,.15); padding:8px 0 10px; cursor:pointer; position:relative; }
  .rail:active { transform:scale(.97); }
  .rail .stack { display:flex; flex-direction:column-reverse; align-items:center; gap:5px; min-height:190px; justify-content:flex-start; }
  .rbead { width:34px; height:34px; border-radius:50%; box-shadow:inset -4px -5px 8px rgba(0,0,0,.35), inset 3px 4px 6px rgba(255,255,255,.55), 0 2px 4px rgba(0,0,0,.4); position:relative; flex:0 0 auto; }
  .rbead::after { content:""; position:absolute; left:22%; top:13%; width:34%; height:24%; border-radius:50%; background:rgba(255,255,255,.85); filter:blur(1px); }
  .rail .rbead.top { width:42px; height:42px; animation:bob 1.1s ease-in-out infinite; box-shadow:inset -4px -5px 8px rgba(0,0,0,.35), inset 3px 4px 6px rgba(255,255,255,.55), 0 0 0 3px rgba(255,235,170,.75), 0 4px 10px rgba(0,0,0,.45); }
  @keyframes bob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
  .rail .rname { text-align:center; font-size:11px; color:#b7a6e8; margin-top:6px; letter-spacing:1px; }
  .rail.empty { opacity:.45; cursor:default; }
  .btnrow { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; border:none; border-radius:14px; padding:12px 0; font-size:15px; font-weight:700; cursor:pointer; letter-spacing:1px; }
  .btn.gold { background:linear-gradient(180deg,#ffd873,#f5a623); color:#5b3400; box-shadow:0 6px 16px rgba(245,166,35,.35); }
  .btn.ghostb { background:rgba(255,255,255,.12); color:#e9dcff; }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.4; }
  /* 覆盖层 */
  .overlay { position:fixed; inset:0; background:rgba(14,7,30,.82); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.hidden { display:none; }
  .card { width:100%; max-width:400px; background:linear-gradient(165deg,#34205e,#22133f); border:1px solid rgba(255,255,255,.18); border-radius:22px; padding:28px 24px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.55); }
  .card .big { font-size:52px; }
  .card h1 { font-size:26px; letter-spacing:4px; margin:8px 0 10px; }
  .card p { font-size:14px; line-height:1.75; color:#d9ccff; }
  .card .best { margin-top:12px; font-size:13px; color:#ffd873; }
  .card .bigbtn { margin-top:18px; width:100%; border:none; border-radius:16px; padding:15px 0; font-size:18px; font-weight:800; letter-spacing:3px; background:linear-gradient(180deg,#ffd873,#f5a623); color:#5b3400; cursor:pointer; box-shadow:0 8px 22px rgba(245,166,35,.4); }
  .card .bigbtn:active { transform:scale(.97); }
  .card .score { font-size:38px; font-weight:800; color:#ffd873; margin:6px 0; }
  .toast { position:fixed; left:50%; top:16%; transform:translateX(-50%); background:rgba(20,10,40,.92); border:1px solid rgba(255,216,115,.6); color:#ffe9ad; padding:9px 18px; border-radius:999px; font-size:14px; z-index:60; opacity:0; pointer-events:none; transition:opacity .25s; white-space:nowrap; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a href="../index.html">← 大厅</a>
    <div class="tname">🔮 琉璃珠串</div>
    <button id="muteBtn" title="静音">🔊</button>
  </div>

  <div class="hud">
    <div class="cell">关卡<b id="hudLevel">1 / 6</b></div>
    <div class="cell">得分<b id="hudScore">0</b></div>
    <div class="cell">串错<b id="hudMiss">0</b></div>
    <div class="cell">用时<b id="hudTime">0s</b></div>
  </div>

  <div class="panel">
    <div class="secttl">✦ 目 标 花 样 · 串 绳 区 ✦</div>
    <div id="stringZone">
      <div id="rope"></div>
      <div id="slots"></div>
    </div>
    <div class="hintline" id="hintLine">点下方轨道顶端的珠子，把它串上绳 · 点绳上最后一颗可退回</div>
  </div>

  <div class="panel" style="margin-top:12px;">
    <div class="secttl">✦ 琉 璃 轨 道 ✦</div>
    <div id="rails"></div>
    <div class="btnrow">
      <button class="btn ghostb" id="undoBtn">↩ 退回一颗</button>
      <button class="btn gold" id="restartBtn">↻ 重串本关</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="startScr">
  <div class="card">
    <div class="big">🔮</div>
    <h1>琉璃珠串</h1>
    <p>轨道里混着各色琉璃珠，点轨道顶端那颗就能串上绳。<br>照绳上虚线圈的目标花样一颗颗串对，串错了点最后一颗退回。<br>一共 6 关，花样越来越长，颜色越来越多。</p>
    <div class="best" id="startBest">最高分：0</div>
    <button class="bigbtn" id="startBtn">开 始 串 珠</button>
  </div>
</div>

<div class="overlay hidden" id="endScr">
  <div class="card">
    <div class="big" id="endEmoji">🏆</div>
    <h1 id="endTitle">手串完成！</h1>
    <p id="endDesc">六条花样全部串对，老板娘夸你好手艺。</p>
    <div class="score" id="endScore">0</div>
    <div class="best" id="endBest">最高分：0</div>
    <button class="bigbtn" id="againBtn">再 来 一 局</button>
  </div>
</div>

<script>
"use strict";
/* ---------- 极简合成音效 ---------- */
let AC = null, muted = false;
function beep(f, d, type, v, delay) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (d || 0.09));
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + (d || 0.09) + 0.03);
  } catch (e) {}
}
const sfx = {
  click: () => beep(620, 0.06, "sine", 0.10),
  put:   () => { beep(880, 0.07, "sine", 0.13); beep(1320, 0.08, "sine", 0.08, 0.04); },
  wrong: () => beep(170, 0.16, "sawtooth", 0.10),
  back:  () => beep(420, 0.07, "sine", 0.10),
  win:   () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.16, "triangle", 0.13, i * 0.09)); }
};
document.getElementById("muteBtn").addEventListener("click", function () {
  muted = !muted;
  this.textContent = muted ? "🔇" : "🔊";
  if (!muted) sfx.click();
});

/* ---------- 游戏数据 ---------- */
const COLORS = [
  { name: "胭脂红", c1: "#ff8a9a", c2: "#d81b46" },
  { name: "孔雀蓝", c1: "#7cc7ff", c2: "#1663c7" },
  { name: "翡翠绿", c1: "#8df0b3", c2: "#0f9d63" },
  { name: "琥珀金", c1: "#ffe27a", c2: "#e08a00" },
  { name: "紫晶",   c1: "#d3a6ff", c2: "#7b2ff7" }
];
const LEVELS = [
  { len: 6,  colors: 3, rails: 3 },
  { len: 8,  colors: 3, rails: 3 },
  { len: 9,  colors: 4, rails: 3 },
  { len: 10, colors: 4, rails: 3 },
  { len: 11, colors: 5, rails: 4 },
  { len: 12, colors: 5, rails: 4 }
];
const BEST_KEY = "gh_liuli_best";

let level = 0, score = 0, miss = 0, seconds = 0, timer = null, playing = false;
let pattern = [];        // 目标颜色序列（颜色下标）
let rails = [];          // 每条轨道：珠子数组，末尾 = 顶端可取
let strung = [];         // 已串：{color, rail}
let busy = false;

const $ = id => document.getElementById(id);
const slotsEl = $("slots"), railsEl = $("rails");

function beadBg(ci) {
  const c = COLORS[ci];
  return "radial-gradient(circle at 32% 28%, " + c.c1 + " 0%, " + c.c2 + " 78%)";
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1500);
}

function genLevel(li) {
  const cfg = LEVELS[li];
  pattern = [];
  let prev = -1, run = 0;
  for (let i = 0; i < cfg.len; i++) {
    let c;
    do { c = Math.floor(Math.random() * cfg.colors); } while (c === prev && run >= 2);
    if (c === prev) run++; else { prev = c; run = 1; }
    pattern.push(c);
  }
  // 逆向发珠保底可解：从花样末尾往前，把珠子依次压到随机轨道顶端
  rails = Array.from({ length: cfg.rails }, () => []);
  for (let i = pattern.length - 1; i >= 0; i--) {
    rails[Math.floor(Math.random() * cfg.rails)].push(pattern[i]);
  }
  strung = []; miss = 0; seconds = 0;
}

function render() {
  $("hudLevel").textContent = (level + 1) + " / " + LEVELS.length;
  $("hudScore").textContent = score;
  $("hudMiss").textContent = miss;
  $("hudTime").textContent = seconds + "s";
  // 串绳区
  slotsEl.innerHTML = "";
  pattern.forEach((pc, i) => {
    const s = document.createElement("div");
    s.className = "slot";
    const g = document.createElement("div");
    g.className = "ghost"; g.style.borderColor = COLORS[pc].c2; g.style.background = COLORS[pc].c1 + "22";
    s.appendChild(g);
    if (i < strung.length) {
      const b = document.createElement("div");
      b.className = "bead"; b.style.background = beadBg(strung[i].color);
      s.appendChild(b);
      if (strung[i].color !== pc) s.classList.add("wrong");
      if (i === strung.length - 1) { s.classList.add("last"); s.addEventListener("click", undoLast); }
    }
    slotsEl.appendChild(s);
  });
  // 轨道区
  railsEl.innerHTML = "";
  rails.forEach((rail, ri) => {
    const d = document.createElement("div");
    d.className = "rail" + (rail.length ? "" : " empty");
    const st = document.createElement("div"); st.className = "stack";
    rail.forEach((ci, bi) => {
      const b = document.createElement("div");
      b.className = "rbead" + (bi === rail.length - 1 ? " top" : "");
      b.style.background = beadBg(ci);
      st.appendChild(b);
    });
    d.appendChild(st);
    const nm = document.createElement("div"); nm.className = "rname";
    nm.textContent = "轨道 " + (ri + 1);
    d.appendChild(nm);
    d.addEventListener("click", () => takeFromRail(ri));
    railsEl.appendChild(d);
  });
  $("undoBtn").disabled = !strung.length || busy;
}

function takeFromRail(ri) {
  if (!playing || busy) return;
  const rail = rails[ri];
  if (!rail.length) return;
  if (strung.length >= pattern.length) return;
  busy = true;
  const ci = rail.pop();
  strung.push({ color: ci, rail: ri });
  const pos = strung.length - 1;
  if (ci === pattern[pos]) { sfx.put(); }
  else { miss++; sfx.wrong(); toast("这颗颜色不对，点它可以退回"); }
  render();
  setTimeout(() => { busy = false; render(); checkWin(); }, 240);
}

function undoLast() {
  if (!playing || busy || !strung.length) return;
  const b = strung.pop();
  rails[b.rail].push(b.color);
  sfx.back();
  render();
}

function checkWin() {
  if (strung.length !== pattern.length) return;
  if (!strung.every((b, i) => b.color === pattern[i])) return;
  // 过关结算
  const gain = Math.max(120, pattern.length * 100 + Math.max(0, 300 - seconds * 3) - miss * 40);
  score += gain;
  sfx.win();
  render();
  if (level >= LEVELS.length - 1) { endGame(true); return; }
  toast("第 " + (level + 1) + " 关串对啦！+" + gain + " 分");
  level++;
  setTimeout(() => { genLevel(level); render(); }, 1100);
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => { if (playing) { seconds++; $("hudTime").textContent = seconds + "s"; } }, 1000);
}

function startGame() {
  level = 0; score = 0;
  playing = true;
  genLevel(0);
  render();
  startTimer();
  $("startScr").classList.add("hidden");
  $("endScr").classList.add("hidden");
  sfx.click();
}

function endGame() {
  playing = false;
  clearInterval(timer);
  const best = Math.max(score, +(localStorage.getItem(BEST_KEY) || 0));
  localStorage.setItem(BEST_KEY, best);
  $("endScore").textContent = score;
  $("endBest").textContent = "最高分：" + best;
  $("endScr").classList.remove("hidden");
}

$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);
$("undoBtn").addEventListener("click", undoLast);
$("restartBtn").addEventListener("click", () => { if (playing) { genLevel(level); render(); sfx.back(); } });
$("startBest").textContent = "最高分：" + (localStorage.getItem(BEST_KEY) || 0);
genLevel(0); render();
</script>
</body>
</html>
