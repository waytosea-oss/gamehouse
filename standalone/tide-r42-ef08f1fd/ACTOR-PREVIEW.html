<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汐之间 R4.2 · 人物透明动画检视</title><link rel="stylesheet" href="style-r41.css?v=20261121r42"><style>body{padding:12px}.inspect{max-width:1100px;margin:auto}.inspect h1{font-size:23px}.inspect p{font-size:14px}.inspect-controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.inspect-controls button{min-height:44px}.inspection-scene{height:calc(100dvh - 190px);min-height:420px;max-height:680px;position:relative;overflow:hidden;background:var(--plate) center/cover no-repeat}.inspection-scene .actor-stage{right:15%;height:98%}.inspect-note{position:absolute;bottom:10px;left:10px;z-index:4;padding:8px 12px;background:#13252bcb;max-width:90%;font-size:14px}@media(max-width:700px){.inspection-scene{background-image:var(--mobile)}.inspection-scene .actor-stage{right:-4%;height:96%;width:100%}}</style><main class="inspect"><h1>R4.2 · 整人透明动画资产检视</h1><p>AI生成连续表演 → 抽帧抠像 → 透明序列。此页不读写存档、不计分、不发奖励。供美术复核，非游戏录屏。</p><div class="inspect-controls"><button data-who="gu">顾遥</button><button data-who="lu">陆川</button><button data-mood="neutral">自然待机</button><button data-mood="warm">亲近回应</button><button data-mood="cold">疏淡／失望</button><button data-mood="angry">克制不满</button></div><section class="inspection-scene" id="inspection"></section><p>可检查闭眼、眼神、嘴角及小幅姿态；切后台与“减弱动态”应暂停。开心与不满是否符合稳重人设，仍需真人看完整视频复核。</p></main><script src="emotions.js"></script><script src="assets/actors/catalog-r42.js?v=20261121r42"></script><script src="actors-r41.js?v=20261121r42"></script><script>let who='gu',mood='neutral';const box=document.getElementById('inspection');function show(){const place=who==='gu'?'cafe':'dock';box.style.setProperty('--plate',`url('assets/png/${place}-clean.png')`);box.style.setProperty('--mobile',`url('assets/png/${place}-clean-mobile.png')`);box.innerHTML=TideActors.markup(who)+`<div class="inspect-note">${who==='gu'?'顾遥':'陆川'} / ${{neutral:'自然待机',warm:'亲近回应',cold:'疏淡／失望',angry:'克制不满'}[mood]} · 仅资产预览</div>`;TideActors.preview(box.querySelector('.actor-stage'),who,mood);}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.who)who=b.dataset.who;if(b.dataset.mood)mood=b.dataset.mood;show();});show();</script></html>
