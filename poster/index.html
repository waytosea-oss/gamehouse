  #stage { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #poster {
    position:relative; width:min(96vw, 52vh);
    border-radius:14px; overflow:hidden; isolation:isolate;
    box-shadow:0 30px 80px rgba(0,0,0,.75), 0 0 0 2px rgba(212,175,55,.55), 0 0 44px rgba(255,210,90,.18);
    background:#0a1f10; touch-action:none;
  }
  #poster::before { content:""; display:block; padding-top:177.78%; }
  .layer { position:absolute; pointer-events:none; will-change:transform; }
  #vidLayer { inset:0; z-index:1; }
  #vidLayer video { width:100%; height:100%; object-fit:cover; transform:scale(1.07) translateY(1.6%); display:block; transition:opacity .18s ease; }
  #rays { inset:-25%; z-index:2; mix-blend-mode:screen; opacity:.45; pointer-events:none; position:absolute;
    background:
      linear-gradient(105deg, transparent 42%, rgba(255,240,180,.18) 50%, transparent 58%),
      linear-gradient(118deg, transparent 60%, rgba(255,240,180,.12) 68%, transparent 76%);
    animation:rayPulse 7s ease-in-out infinite; }
  @keyframes rayPulse { 0%,100%{opacity:.3} 50%{opacity:.52} }
  .bfly { z-index:5; width:13%; position:absolute; pointer-events:none; will-change:transform; }
  .bfly .inner { animation:flap .34s ease-in-out infinite alternate; transform-origin:50% 50%; }
  .bfly img { width:100%; display:block; filter:drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  @keyframes flap { from{transform:scaleX(1) rotate(-4deg)} to{transform:scaleX(.55) rotate(4deg)} }
  #fx { inset:0; z-index:6; width:100%; height:100%; position:absolute; pointer-events:none; }
  #vignette { inset:0; z-index:7; position:absolute; pointer-events:none; box-shadow:inset 0 0 90px rgba(2,20,8,.5), inset 0 -60px 80px rgba(2,20,8,.4); }
  /* slim title, top-left, never covers the face */
  #titleLayer { z-index:8; top:10px; left:10px; position:absolute; pointer-events:auto; transition:opacity 1.2s ease; }
  #titleLayer.dim { opacity:.42; }
  #titleLayer.off { opacity:0; pointer-events:none; }
  .plaque { display:flex; align-items:baseline; gap:9px; padding:7px 13px 6px; border-radius:10px;
    background:linear-gradient(180deg, rgba(10,30,15,.92), rgba(6,20,10,.88));
    border:1.5px solid rgba(230,190,90,.85);
    box-shadow:0 0 0 3px rgba(20,50,26,.45), 0 10px 22px rgba(0,0,0,.45), inset 0 0 18px rgba(255,215,110,.12); }
  .dia { width:6px; height:6px; background:#e8c56a; transform:rotate(45deg) translateY(-1px); flex:none; box-shadow:0 0 6px rgba(232,197,106,.8); }
  h1 { font-family:"STKaiti","KaiTi","FangSong",serif; font-weight:900;
    font-size:clamp(21px,4.4vh,30px); line-height:1.1; letter-spacing:.12em;
    background:linear-gradient(180deg,#fff6c8 5%,#ffd968 38%,#e79b2d 62%,#ffe98f 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 1px 0 rgba(90,45,0,.85)) drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  .sub { font-family:Georgia,serif; color:#f3d98b; font-size:8px; letter-spacing:.26em; text-shadow:0 1px 2px rgba(0,0,0,.8); white-space:nowrap; }
  #eyeBtn { position:absolute; z-index:9; top:10px; right:10px; width:38px; height:38px; border-radius:50%;
    border:1.5px solid rgba(232,197,106,.8); background:rgba(8,28,14,.72);
    display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; }
  #eyeBtn svg { width:21px; height:21px; }
  #eyeBtn.off { opacity:.55; }
  /* bottom control dock: real working buttons */
  #dock { position:absolute; z-index:9; left:3%; right:3%; bottom:2%; display:flex; align-items:center; gap:8px;
    padding:8px; border-radius:14px; pointer-events:auto;
    background:linear-gradient(180deg, rgba(10,30,15,.88), rgba(6,20,10,.9));
    border:1px solid rgba(230,190,90,.55); box-shadow:0 12px 28px rgba(0,0,0,.5); }
  #musicBtn { flex:none; width:42px; height:42px; border-radius:50%;
    border:1.5px solid rgba(232,197,106,.85); background:rgba(20,50,26,.8);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s; }
  #musicBtn:active { transform:scale(.92); }
  #musicBtn svg { width:22px; height:22px; }
  #musicBtn .slash { display:none; }
  #musicBtn.muted .slash { display:block; }
  #musicBtn.muted .waves { display:none; }
  #musicBtn.playing { animation:btnGlow 1.8s ease-in-out infinite; }
  @keyframes btnGlow { 0%,100%{box-shadow:0 0 0 0 rgba(255,215,110,.45)} 50%{box-shadow:0 0 0 9px rgba(255,215,110,0)} }
  #chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; padding:2px; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:8px 11px; border-radius:999px; cursor:pointer; user-select:none; -webkit-user-select:none;
    border:1px solid rgba(232,197,106,.55); color:#ffe9a8; background:rgba(20,45,25,.55);
    font-size:13px; letter-spacing:.05em; white-space:nowrap; transition:all .15s; }
  .chip:active { transform:scale(.95); }
  .chip.active { background:linear-gradient(180deg,#ffe98f,#e79b2d); color:#3a2403; font-weight:700; border-color:#ffe98f;
    box-shadow:0 0 14px rgba(255,205,80,.5); }
  #hint { color:rgba(255,240,200,.75); font-size:12px; letter-spacing:.12em; z-index:1; text-shadow:0 1px 3px #000; text-align:center; padding:0 12px; }
</style>
</head>

    <canvas class="layer" id="fx"></canvas>
    <div id="vignette"></div>
    <div id="titleLayer">
      <div class="plaque"><span class="dia"></span><h1>奇妙森林</h1><span class="sub">MYSTIC FOREST</span><span class="dia"></span></div>
    </div>
    <div id="eyeBtn" title="显示/隐藏标题">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffe9a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
    <div id="dock">
      <div id="musicBtn" class="muted" title="开/关音乐">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffe9a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="#ffe9a8" stroke="none"/>
          <path class="waves" d="M15 9.5a4 4 0 0 1 0 5"/><path class="waves" d="M17.5 7a8 8 0 0 1 0 10"/>
          <line class="slash" x1="4" y1="4" x2="20" y2="20" stroke="#ff9d7a" stroke-width="2.2"/>
        </svg>
      </div>
      <div id="chips"></div>
    </div>
  </div>
  <div id="hint">点下方按钮换舞姿，配乐跟着换 · 左下喇叭开音乐 · 右上眼睛藏标题</div>
</div>
<script>
const DANCES = [{"name": "林间舞", "src": "forest.mp4"}, {"name": "踢踏舞", "src": "jig.mp4"}, {"name": "芭蕾舞", "src": "ballet.mp4"}, {"name": "月光舞", "src": "moon.mp4"}, {"name": "篝火舞", "src": "fire.mp4"}, {"name": "弗拉门戈", "src": "flam.mp4"}];
const poster = document.getElementById('poster');
function fit() {
  const w = Math.min(window.innerWidth * .96, (window.innerHeight - 72) * .5625);
  if (w > 200) poster.style.width = w + 'px';
}
window.addEventListener('resize', fit); fit();
const vid = document.getElementById('danceVid');
vid.src = DANCES[0].src;
vid.play().catch(() => {});
const btn = document.getElementById('musicBtn');
btn.addEventListener('click', e => {
  e.stopPropagation();
  vid.muted = !vid.muted;
  btn.classList.toggle('muted', vid.muted);
  btn.classList.toggle('playing', !vid.muted);
  if (!vid.muted) vid.play();
});
// dance switching: each dance carries its own music track
const chipsBox = document.getElementById('chips');
let cur = 0, switching = false;
DANCES.forEach((d, i) => {
  const c = document.createElement('div');
  c.className = 'chip' + (i === 0 ? ' active' : '');
  c.textContent = d.name;
  c.addEventListener('click', () => switchDance(i));
  chipsBox.appendChild(c);
});
function switchDance(i) {
  if (i === cur || switching) return;
  switching = true; cur = i;
  [...chipsBox.children].forEach((c, j) => c.classList.toggle('active', j === i));
  vid.style.opacity = 0;
  setTimeout(() => {
    vid.src = DANCES[i].src;
    vid.play().catch(() => {});
    vid.style.opacity = 1;
    switching = false;
  }, 190);
}
// title: slim, auto-dims, eye button hides it
const title = document.getElementById('titleLayer');
const eye = document.getElementById('eyeBtn');
setTimeout(() => title.classList.add('dim'), 4000);
title.addEventListener('pointerdown', () => title.classList.remove('dim'));
eye.addEventListener('click', e => {
  e.stopPropagation();
  title.classList.toggle('off');
  eye.classList.toggle('off');
});
// ---- parallax ----
let tx = 0, ty = 0, cx = 0, cy = 0;
poster.addEventListener('pointermove', e => {
  const r = poster.getBoundingClientRect();
  tx = ((e.clientX - r.left) / r.width - .5) * 2;
  ty = ((e.clientY - r.top) / r.height - .5) * 2;
});
poster.addEventListener('pointerleave', () => { tx = 0; ty = 0; });
const layers = [
  { el: document.getElementById('vidLayer'), d: 5 },
  { el: document.getElementById('rays'), d: 3 },
  { el: title, d: 7 },
];
const flies = [...document.querySelectorAll('.bfly')].map((el, i) => ({
  el, seed: i * 2.39 + 1.3,
  bx: [46, 14, 55][i], by: [18, 36, 44][i], s: [.8, .55, .65][i]
}));
flies.forEach(f => { f.el.style.width = (13 * f.s / .8) + '%'; layers.push({ el: f.el, d: +f.el.dataset.depth, fly: true }); });
// ---- petals & fireflies ----
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H;
function resize() { W = cv.width = poster.clientWidth; H = cv.height = poster.clientHeight; }
new ResizeObserver(resize).observe(poster); resize();
const petals = Array.from({length: 14}, () => ({ x: Math.random(), y: Math.random(), s: 4 + Math.random()*6, v: .00045 + Math.random()*.0008, ph: Math.random()*6.28, hue: 320 + Math.random()*40 }));
const fireflies = Array.from({length: 20}, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random()*1.8, ph: Math.random()*6.28, sp: .2 + Math.random()*.5 }));
function frame(t) {
  const auto = Math.sin(t * .00022) * .35;
  const gx = tx + auto, gy = ty + Math.cos(t * .00017) * .22;
  cx += (gx - cx) * .045; cy += (gy - cy) * .045;
  for (const L of layers) {
    if (L.fly) continue;
    L.el.style.transform = `translate(${(-cx * L.d).toFixed(1)}px, ${(-cy * L.d * .7).toFixed(1)}px)`;
  }
  flies.forEach((f, i) => {
    const tt = t * .00016 + f.seed * 3;
    const x = f.bx + Math.sin(tt * 1.7 + f.seed) * 10 + Math.sin(tt * .6) * 5;
    const y = f.by + Math.cos(tt * 2.3 + f.seed) * 6;
    const tilt = Math.sin(tt * 1.7 + f.seed) * 18;
    f.el.style.left = `calc(${x}% + ${(-cx * (18 + i * 6)).toFixed(1)}px)`;
    f.el.style.top = `calc(${y}% + ${(-cy * 12).toFixed(1)}px)`;
    f.el.style.transform = `rotate(${tilt.toFixed(1)}deg)`;
  });
  ctx.clearRect(0, 0, W, H);
  for (const p of petals) {
    p.y += p.v; p.x += Math.sin(t * .001 + p.ph) * .00035;
    if (p.y > 1.03) { p.y = -.03; p.x = Math.random(); }
    const x = p.x * W, y = p.y * H, r = p.s * (W / 540);
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * .0012 + p.ph) * .9);
    ctx.fillStyle = `hsla(${p.hue},85%,80%,.75)`;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * .55, 0, 0, 6.29); ctx.fill(); ctx.restore();
  }
  for (const f of fireflies) {
    const x = (f.x + Math.sin(t * .0001 * f.sp + f.ph) * .03) * W;
    const y = (f.y + Math.cos(t * .00013 * f.sp + f.ph) * .025) * H;
    const a = .35 + .35 * Math.sin(t * .0016 * f.sp + f.ph);
    const g = ctx.createRadialGradient(x, y, 0, x, y, f.r * 5);
    g.addColorStop(0, `rgba(255,240,170,${a})`); g.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, f.r * 5, 0, 6.29); ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
